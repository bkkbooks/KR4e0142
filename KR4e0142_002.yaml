思緑滿枝東流波無盡時送君長安道傷心對秋草祗道蠶時歸而今桑已老君真棄妾妾憐君暮暮朝朝作雨雲隨風忽上君衣袖莫道無聲君不聞美人歌題潘侍御畫緑窗朱户悄無人花枝照眼明青春美人睡起向花語驚回蝴蝶飛西鄰珮環欲整嬌未已蝴蝶不來花莫嗔寒煙作愁千萬縷鶯梭燕剪催人頻機頭織羅才丈二冉冉日月將逾旬舅姑年來厭紈綺此羅豈欲榮妾身聞道兒夫致將相織成仍繡雙麒麟君不聞樂羊妻有言繭絲積寸至丈匹天下事難倉卒成獨立清陰花繞膝題李冬官時升墨竹淇園園中萬竿竹疏如離人密如簇清陰不逐梧桐梢髙幹還來鳳凰宿長空夜寒雲不流鳳凰雍雍鳴上頭媧皇倚聽截笙管一十二簧聲遞換漢中郎笛秦女簫律吕隨風切雲漢君不見王子猷此君不可一日無又不見阮嗣宗中林嘯傲仍提壺謫仙之裔亦愛此髙興復與前人殊欲劙老節紀故事汗青滴滴秋霜孤枝柯瑣屑亦不棄急呼毛頴濡其須上下百千萬億載潛光寒骨蒙褒誅嗟哉虛心致用君子器乘時釣寵非吾徒為語徂徠及新甫同盟嵗晏期不渝上劉司徒東南白鶴清且孤往嵗亦上黃河圗刋山注海功立就萬姓得免魚鱉區商宗午夜夢良弼曉入豸府風雷俱諸難歷嘗漢太傅三物竟付周司徒平生蓬藋切山斗畫省未敢輕摳趨涯師丈席一相睹氷雪落齒幽襟孚維公鳳凰下千仭安能顧此雞與鳬芝蘭蕭艾兩不棄亦謂此是同年雛開心已覺江海傾憂世忽睹春陽鋪宰臣謀國知即語逺視萬里如坐隅嗟哉萬事動有拘安得回天如轉樞上為文武佐張弛下為匹夫匹婦完肌膚後生小子非獻諛亦豈抵好吹齊竽斯文世契有相感景望詎忍分雲塗聽雨芙蕖出水髙作盤夜來著雨聲珊珊客愁萬種滴未盡離夢五更敲欲殘翠衾生寒花氣濕庭階無人蟲唧唧起看緑柄仍扶疏何處湘靈鼓瑶瑟君不見芭蕉葉梧桐枝離人一聽思千里亦有潸然墮淚時䦨前不復植此種恐經百感凋華姿今宵忽聽荷盤雨依舊閒愁千萬縷乃知古來壯士多悲心不用當筵怨歌舞東風别我欲留東風東風不可留百花吹盡已無力青輿旋軫芳池頭啾啾鳥聲啼不歇就中黃鸝最啁哳千呼萬轉喚不回東風東風從此别嗟哉進退與疾遲不言君自知陰陽莫道如環轉秋菊春蘭亦有時樵山吟樵夫嵗嵗居樵山短斧入山樵採還雙肩向市易斗粟堂上日暮俱垂斑官家謬選備工役報國那能惜斤力運斤直瞰危鶻巢喚侣時招牧牛笛寧知今年法令改青山却用金錢買有斧不得重刋雲無錢誓欲先逾海昨日城中丁壯來城中百事猶傷哉析薪已費千餘萬賣子不足私門陪衣裳藍縷敢自惜已看釡甑生塵埃貧家止有田十畝定知明年非我有安能遁跡豺虎之深林縣官來時無處尋吳侍御父母挽詩青山日暮生紫烟豈有寶玉藏山顛層巒如壁護風雨林鳥喔喔號旻天山中行人知故事江南往日多遺賢鼓琴不獨伯鸞隱亦有種德如耕田人消嵗改墓木拱兒身復在君王邊天書昨夜贈泉壤寒光直與青山連鳶肩豸角世所貴寧知季路心悽然欲知季路心悽然檗苦梅酸年又年殘鶯歌賤子歌殘鶯鶯歌聲遞續負此垂楊陰明朝日月促宛轉復遲回莫是離人曲似恨上林枝春啼猶未足玉堤幾度聽淒清半是湘靈鼓瑟聲朝桃花上音難寫暮雨臺中夢不成幽谷東頭喬木近殷勤更奏商絃引征馬踟蹰淚暗垂芳心鬱結愁難盡殘鶯復殘鶯羇懷今夜生茫茫海角難求友漠漠天涯誰有情須知不是烏衣比空煩王謝堂中耳今人惟有名利親不愛清秋愛暮春老舌如簧君莫惜隄防利口能黃白送伍朝信守寧波官栁風柔拂酒盞渭北江東意何限五馬誰驅髙蓋車畫省秋雲猶滿眼纍纍肘印腰帶黃太守年才三十强閭門不敢鳴騶過里中長老多父行髙堂日遲采衣舞一觴一咏聲琅琅紫微巨公顔色揚諸孫繞膝兒繞牀牀頭經史映簮笏膝下歡娛殊未央親恩君寵兩磅礴膏雨還隨使車落深村無吠􅀈公府多神雀愛月還登鎮海樓尋幽或到燒丹壑鏡川幾曲春澄澄人言使君如水清棠陰無事坐舒嘯惟聽江聲雜鳥聲題程正郎蟾宫折桂瓊林錫宴詩卷蟾宫前後交桂陰桂氣襲人寒不禁吳剛倚斧夜不寐兔毫冷浸氷壺深青袍緑鬢誰氏子獨上雲霄親折取歸時不遣素蛾知兩腋西風日千里東風吹塵紅映道恩光著袍緑如草男兒得意非尋常出門仰天氣浩浩雕瓊作樹瑶作華乘春早宴仙人家驀聽虞韶雜鳴鳳停杯一嘯凌紫霞聞羅景鳴入京鯨牙漱海珠貝翻鼇足暴柱神鬼奔羅生尾月掣兔頴橫筆如彗當天門列星吐焰燒紫垣銀潢小水漂崑崙竒詞一放衆怪縮長劍倚日龍當軒江山何爾鬱始發産此異物之輪囷五經百子世所有咀嚼玩味平且溫片詞尺論一經口噴作萬段霞紛綸羊腸詰屈未足險驚雷破地山欲蹲宗師吐舌方朔走侈麗慎勿矜文園況有元氣貫脈絡髙深得奧愚駭繁聖朝文化洽寰海閭閻草澤俱飾轅固應有此大匠手雕書五輅修輪轓綃纁紘紞方有待豈止山藻兼篪塤材竒益知世運美士大始見民風敦有時調笑狎諸貴意氣豈睹崇與尊我慚同袍更館閣寒鴻乃逐孤鳳騫徒能問字向揚子敢望學劍逢公孫天南矯首識虹采詞海覬君能一援逺别離秦雲隴樹髙復低君去臺輪西更西亦知此别經嵗月臨岐素手牽衣啼山長水深覔無處妾心如荼苦復苦玉容憔悴金縷裂猶憶徘徊出門語春氷易消雲易斷妾意如何不零亂人生難得駐朱顔空帷夜長淚潸潸長相思長相思長且深暮雲湘水愁陰陰海棠庭院燕雙語惱亂無人知妾心妾登池上樓淚滴池中水水聲活活向東流妾淚將心千萬里烏夜啼庭前古槐猶未花寶叉晨入兒夫家兒夫重俠輕離别空林夜半啼烏鴉誰將鴛枕千行淚却寄龍城萬里沙折楊栁千轍萬轍曉行車誰人折栁臨長渠紅顔皓齒春閨女掩袂攀條獨無語秦樓不見吹簫人灞橋空有吟詩侣天長海濶飛鵬翼迢迢直到天池息青瑣朱扉閉阿嬌綺窗日暮生愁色行路難盧家語燕棲畫梁美人夜半宴蘭房瑶琴欲奏弦更張移宫換羽聲低昂歌喉舞袖競韶光花顔照人藕骨香歡娛欲盡解鳴璫寧知杖策走咸陽君門咫尺不得見空彈長鋏歌清商世路﨑嶇行不易丈夫未遇同尋常怨歌行黃牛將犢雞將雛辛苦不異汝與吾一朝雛犢背母死灑淚空成草頭水梁間紫燕輕復斜誰歌烏衣野草花紡甎尚有未完線繡帖猶藏舊鏤紗吁嗟吾兒不還家城南愁殺雙慈鴉上殿熊熊上殿昭儀趨誰其當者馮倢妤玊顔豈能編虎鬚不難一死遮乘輿孟陽登牀信誑楚亦有華泉逢丑父分明造次效忠貞豈意嬋媛成錯忤傅姬手持黃紙來昔何勇鋭今何衰兩朝淚濕黃金階宫中妬色亦妬才擬古將進酒銅龍水澀蟾蜍泣桂花參差夜雲碧地上落葉何紛紛花枝不似三春日鴻聲漸逺江水寒百年轉眼風月殘夜深杯滿君莫難寄衣曲越絲回波翔紫鳳丹芝水花相間香并刀剪緑藕絲脫中有二十四鴛鴦碧窗夜寒針指冷一線未縫雙淚迸秦雲隴樹千萬重欲寄還愁道塗梗封題錦字託衣中殷勤先謝西飛鴻銅雀臺西陵緑樹無顔色邯鄲女兒猶豔質魏家空起千金臺一旦飄零同瓦礫名姝綺麗皆塵土至今里女能歌舞粧成仍唱望仙詞夢回不記霓裳譜人間白日奔隙駒緑顔回首雪盈顱秦樓楚榭今安在日暮殘鴉下冷蕪首陽薇朝采薇露未晞夕采薇風凄凄岐山東來墨為縗大白小白懸兩旗食周之粟不如蕨與薇蕨薇雖不飽應是商山草嫵媚謡嫵媚復嫵媚不道李與桃阿嬌十四著繡袍錦襦雙佩并州刀自從貞觀見天子宫粧靚麗珠鞋髙親挑佛燈誦佛語邂逅君王淚如雨未央前殿恰垂簾白馬道場齊抱杵提兵誰遣太法師縳賊親煩長公主大雲經梵不足聽天堂火發延御屏雨露新歸奉宸監浮屠鬼戰金輪庭李花不開媚娘舞海內紛紛爭好武道旁誰遇觸邪冠骨肉不如巖下土磊磈行深林人稀豺虎嘷荒崖墮石海潄濤長安萬里烟浩浩黃金觸手輕如毛貂裘敝盡何足惜腰下焚焚雙寶刀西來黃塵撲天起將軍破敵見天子圉夫竈下盡蒙恩困殺英雄老燕市燕南美人好顔色壓酒槽頭勸行客東風舞折栁絲狂醉擊龍泉按歌拍歌聲嘹亮舞熊柔不數當年宋意謳知已難逢頭易白出門跨馬路悠悠迎冬詞畫簷小鐵嘶北風疏櫳日影搖輕紅疊綺重茵夜雲暖博山紫氣飛遙空霜凄落葉護寒井素綆縈紆指尖冷翠屏東面繡新苔幼出瀟湘美人影日髙寶瑟拂蛛絲魚上深潭雀繞枝十二闌干烟細細伊州一曲譜相思大陸行大陸澤水秋泠泠葦花初白荷蓋青紅裙蕩槳紅波靚八月江寒猶采菱菱角槎牙芡實滿明珠紫貝多零散白日清歌應石淙黃昏鳴佩隨歸伴西風作惡凋苧衣穠華回首葉飛飛塞鴻嘹唳江南歸陽和漸减霜生威百年富貴轉眼非昔人遊處尚依稀水頭屏營見漁火深夜洞房清淚微陌上花歎陌上花何離離秋風吹汝汝不知汝有丹葩及紫萼恨汝不值瓊瑶池朝朝行人暮遊子泣露酣霞何日止花枝漸减秋月寒獨抱餘芳道旁死不如二月楊栁綿猶自飄揚帝城裏八月九日雨前年棘闈苦多雨觀音街前泥沒股單袍赤腳來叩簾八郡英豪面如土今年此日雨復多長安走馬知如何魚龍慣識風浪色禹門寧畏髙嵳峩衝冠已奪戰士氣落筆不數將軍戈豈無昌黎豁衡嶽或有傅說為滂沱桂香葳㽔晚含露天漢西流聞棹歌大行山行大行之山何崔嵬巖幽谷隱藏風雷漢軍已料騎士屈魏武重歎車輪摧其開如陘下如井雲作炊烟瀑垂綆羊牛只道來層霄雞犬方知接人境山僧何年住山頂亦有山田二三頃非關避世應避名我欲從之玩流景行遊樂初夏清和燕子飛遊人陌上鬬輕肥羅襦小步作伴歸翻涴宫袍新賜衣去年幽花恨欲死今年花飛逐流水是處笙歌感嵗華何人夜月思千里紛紛末俗不足謀豈獨當時趙孟偷一餉清談誤平世空令兒輩說風流城南思肥纍城南花滿地紫燕雙飛掠香水雕題畫棟帶新巢惆悵重來阿嬌死堂前寶瑟待新張短扇輕衫生細涼疇知兒女成參商一日悲歌千斷腸窮通夀夭不有素小智鍾情苦復苦輕顰巧笑尚平生骨肉分明化為土城頭漏盡西日徂有錢莫下黃公壚爛醉百年何所惜鸞鳳鴟梟等無益涼風曲涼風涼風汝勿至行人為君掩雙耳緑楊蕭蕭葉半脫一步愁深千萬里昨朝猶著越羅裳今夜洞房添錦綺百年展轉涼復暄緑髮絲絲今幾縷涼風涼風汝勿至江天寂寥愁到爾妾薄命女家趙下襄陽曲往來大河蕩輕槳嬌紅膩白照清波一曲髙歌衆惆悵去年花枝今又紅白日西沒月生東顔色空隨落花陳恩情旋逐東南風當時容顔不自保而今零落同秋草夜夜傷心淚暗垂出門萬里長安道雨雁詞猛雨斷哀雁離離不成行寒雲蔽關塞落月暗瀟湘樓中鼓角飛秋霜仰看孤影空倣徨拈針繡作孤鴛鴦為寄逺遊都下郎燈寒指冷夜寂寂獨抱瑶琴為君泣郤湖獻俠纍死袁絲僵近時裴公亦被創臣豈不念存與亡丈夫許國能自臧況聞君王旰未食思政殿前還歎息不才幸備鼎趾臣豈惜微軀化為臘江西湖南獻各寢頭上神明方懍懍金吾兩導夜逶迤臣有丹心為君盡撓法全身臣豈忍熊峯集卷二
