body:
  text: 熊峯集卷二明石珤撰詩七言古阿堵歌銅山夜焰熏天紅寶鼎不藉鈐椎功東吳黠匠誇老手一日萬斛海水空何人冷笑九府公逆濞已死惟佞通虛名狼籍遍天下赤龍不救騰蛇窮沈郎兄弟一朝貴坐困海內諸豪雄金門紫闥明出入鴟鼫得志聲隆隆北州司徒枉才士腥風一流千萬里雀環太尉那易逢直須痛飲潯陽市蚨婆生兒好顔色豈徒褒妲能傾國一丈珊瑚滿塢金千年不化叨翁血九逵一動呼魯褒剛風颼飀吹布袍阿堵繞身凡幾遭鱗鱗忽觸南斗髙爛醉起來不脫口鳳凰下視百鳥空嘈嘈春鴻曲春宵愛月登髙臺舉首忽見賔鴻來平沙漸暖關塞濶長空萬里心悠哉亦知陽生進君子嗈嗈不似三秋哀揮絃振衣喜欲舞九陌何人更桴鼓山川遙望雲滃然定是今年好風雨五日一雨十日風百穀盡麗陽和中陽和復陽和東風動微波開蓮誇並蒂實頴愛同禾野人還笑春鴻曲不似武皇朱雁歌擬古巫山髙巫山髙十二重攢峯繡出青芙蓉朝雲不還暮雨歇金輿冷落雙盤龍秋橫素山淡相續萬壑鳴泉響寒玉風流宋玉況多情揮絃更奏相思曲曲聲嘹亮繞天愁雨態雲情凝不流寒煙裙紫草鈿碧楚王猶在離宫泣東閣奉試梧桐夜雨街前碧梧十丈長下有鸛鶴上鳳凰鳳凰西飛碧梧老朝風暮雨能凋傷乍聞嘖嘖如私語忽疑四壁鳴蛩螿黃金井邊玉轆轤銀瓶汲水聲琅琅推枕啓門望雲色簷溜滴我羅衣裳倐忽雲消星斗出婆娑老幹猶昂藏道旁何人更太息問之無乃蔡中郎願得孤枝折贈君絃以朱絲發宫商題南山樵隱采采山木凌虛上征松檜干雲幽隱乍明下有飲澗之羣猱上有鳴鳥之嚶嚶短柯一振山谷應豕鹿辟易豺貙驚吾聞仲夏斬陰木百草黃落秋令行先刋菑翳後朴􅈪巨材養之待棟楹城中貴薪若貴桂兩肩取足何求贏從來賢達適志耳豈山而樵惟董生勞形不殊抱甕叟食力亦有孺子耕嗟哉樵隱有至理機事未忘安可評東溪漁樂敲針作鈎絲作綸結繩作網綱目陳長竿裊裊波粼粼逺風來吹頭上巾江花野草俱可悅海鶴嘹唳山猿嚬疇知造物有深意坐我寂寞之江濵得魚換酒亦易致樂與莊叟怡吾真不須羊裘與鶴氅磯頭磊石髙嶙峋意茍造適境亦化不覺宇宙安有人溪南野老相勞問世事了不罥其唇但言堯舜已在上巢許應為草莽臣送王懋綸僉憲還蜀峩眉山錦江水送君西南幾千里秋光如畫當馬頭江草江花何靡靡鳴騶夾道驚山人玉堂霏屑氷霜新丈夫得志橫四海焉得獨守蓬瀛春當時李杜亦落落山川尚擬藏精神今人古人車跡多豪華過眼東流波及時肝膽報明主躍馬食肉亦不頗君看孔明廟前柏銅柯鐵幹猶嵯峩不然託體金鑾坡朝朝染翰宵鳴珂螢流電瞥亦頃刻奈此日近清光何擬古傷歌行葉落花殘君不見春來秋去如飛電富貴千年劫火灰丘陵幾度桑田變五侯髙樓臨大道寶叉金鈿埋秋草張放寧知金穴平楊家一旦氷山倒君看荒冢饒荆棘當年俱有回天力勸君對酒且髙歌莫負庭前芳草色田家行上岡下岡走僕僕驅牛下岡上岡宿岡頭風雨多則多畏有兒童來牧犢短裙蔽膝筐繫肩此是貧人來拾田老夫渾有十畝麥大半人家種子錢年年田中穧不斂今年刮田如鏡面秋田雖好猶未熟熟時更有還官穀東華真人圗代寅軒先生題徐生入海不復還人傳已在三神山山頭宫殿千萬間青玉琢户黃金鐶銀城射日日色斑望之可見不可攀不可攀那可度誰人海上遇安期貌得山光入生素雕瓊作樹瑶作華白璧樓中張采霞靈芝五色蒲九節青鳥窗前墮紅雪蟠桃結實三千秋大仙小仙來宴遊或駕蒼麟或驂赤虯或乘白鹿或服青牛采丹葩兮緑萼雜瑶草兮為羞揚清歌兮雲駐玉麈揮兮風流揚歌兮揮麈吹簫兮擊鼓彈湘絃兮執鷺羽青鳳吟兮白鸞舞吾不知其為誰或童顔而貌古東華真人鬚滿腮吐吞日月餐風雷天漿一滴可以祛塵胎何況日飲三萬杯黃芽夜半珠纍纍瑶光直上衝三台青頭童子時往來我欲因之問王母瑶池之㑹豈可復得哉吾間東方朔李謫仙年來亦在瀛洲邊二君於我有舊故公其為我相周旋不知竒辨猶能雄斗酒一吟今幾篇東華真人笑不語但見花梢露如雨桃源舊事言未終回首洪波幾桑土題瓜瓞圗為劉驗封岡頭十畝春膏足曉色和煙放新緑雕雲撲地正離離忽覩金葩明繡褥長莖短蔓相鉤連巨瓜小瓞珠璧聨蛟龍得雨欲飛走虎豹出穴猶聨拳誰言將軍印如斗掇取纍纍繫雙肘分明釀作清冷泉丹砂玉屑爭春妍士庶不敢輕疐齕錦幕獻將天子前憶昔名工發毫素豈乏青山與茂樹長風悠悠度阡陌平林藹藹幪煙霧謬說根從海上移直疑家近青門住文章五色未足雄子孫千億將無同周人昨夜奏絲竹此意猶播聲詩中瓜瓞兮綿綿綿綿兮瓜瓞為君再頌大雅篇齒頰依稀洞氷雪桑條韋桑條韋青青照田圃二月神龍不行雨緑陰婀娜宿鸚鵡桑韋正含滋鸚鵡來哺兒鳴鳩戢其羽戴勝無降時忙殺蠶姑摧散絲宫中筐筥那得知一絲兩絲繅未盡倦㸃牙籌上堂寢健蛾鼓翅搖春魂踏碎珊瑚黛眉損桑韋桑韋好歸根城南斤斧星月屯潞州别駕宜少恩豹韀騎士身虎文夢程正之少陵三夜夢謫仙魂來魄往楓林前今吾夢君亦連夕邂逅相逢道相憶似為九天風露長悵望江南歸未得布帷夜久風凄凄顛倒衣裳為君啼鴟梟得志燕雀舉鳳鳥文章無宿栖昊天七政誰與齊璣衡倒植昂或低臯陶五帝不可問坐對青燈落寒燼人生逆旅㑹有歸但取榮名比華衮登臨篇登髙丘臨清流驚濤拍岸風蕭颼東奔到海何日休浮生聚散類萍梗滿地花草凝閒愁士稚空盟大江楫仲宣復上荆南樓日落蒼梧思帝子風生蘆葉按伊州富貴豪華成莽蒼斜月窺林影千丈誰家金塢草猶黃舊日歌臺人竟往舊人已往新復來仍張寶瑟勸金杯流魚偶與水相得長嘯不知山欲摧鬢毛未白心成灰城南啼烏聲絶哀長空蘸酒波澒洞峻坂墮足愁崔嵬仰天憤頓一起舞踏碎石壕千古苔清夜遊宫夜泠泠月華白嬌騎踏空紅墮雪西園門外䭾鼓聲十六院中樂齊發楊郎蕭郎各一席千年嚙臂宫娃泣坐中誰是陳宣華寶帶猶拴繍同結芰荷風柔酣酒霞錦繒綳樹啼雙鴉侍臣自舞王自歌蜥蝪香銷金縷紗佛經僕射呼不起梁燕才人竟寃死潼門烽火照宫紅猶自心輕漢天子龍舟翩翩蔽白日醉擁笙歌南下疾一聲悲鐸不堪聽至今江栁生愁色秋蓮曲西塘菡萏初破紅小舟蕩漾東南風羅裙曳水蘸輕碧驚起沙頭雙落鴻昨日采蓮蓮尚好今朝采蓮蓮已老緑房結子空垂垂翠黛朱顔可長保江湖日暮生嫩寒鴛鴦雙飛不過灘回首女伴各無語淚灑銅仙承露盤有所思雙星熒熒隔秋水秋入城頭漏聲裏窗間梧桐風瑟瑟青鳥南飛月華白朱絃一撥意已傳夢繞博山雙紫煙藕絲易脫雲易散十二碧峯秋雨前送靜學先生南還文星夜半屬紫薇北門學士江南歸江頭新水漾輕舸清嘯裂空雲不飛壯逰絶勝窺禹穴錦袍不獨誇漁磯憂深廊廟見顔色歷盡世味忘甘肥鍾山直道饑花鳥寧知衮職思華藻巨筆明教賦兩都安車又見迎三老龍門賤士言非夸海內文章公大家公方鵬運擊千里賤士望洋真井蛙他日龍泉如可用雷生爭敢負張華傷徵伯冀北多駿馬君才自乘黃長安多神雀君才自孤凰一鳴安足盡子志快覽六合窺無旁東遊名山跨絶頂詞焰一吐千丈長槐花照地爛宫綺四方學士奔且僵天門咫尺病在牀老兔泣月秋無光平生佳句漫收録上公來看淚如瀑碧水愁深洗墨池幽庭恨折棲鸞竹海波東流日西傾古來轗軻幾豪英鵩鳥不還賈太傅鸚鵡重傷禰正平造物生才意良亟往往棄之不甚惜豈有蒼天忌令名至今蘭畹生荆棘世間萬事莫開口誰人松柏誰蒲栁陵谷猶應有變遷神仙詎謂能長久因君感慨壯且衰樓外瑟瑟陰風來君豈復能登髙臺長流濯足一萬里落日髙歌三百杯人生有生㑹有盡清淚等間成緑苔競渡辭競渡復競渡波光浩渺渺潮頭如馬來舟子疾於鳥輕舠迅楫鬬繽紛伊誰從之楚靈均江深海濶安得濟鼉抃鯨吞愁殺人蒼天不照烈士苦日暮洞庭聞擊鼓九辨誰招夢澤魂一杯枉酹荆南土競渡兮來歸湖上兮依依櫂歌齊發淚沾衣寶笙瑶瑟清且哀四望躑躅悲又悲安能遇君與君攜暮夜金暮夜金光陸離故人心君不知金經百煉不爽毫與釐故人之心良似之還君金君往矣但願君為清白吏絶勝千金報知已九門城晨望平原黍稌風凄凄漢家荒城大道西田間古瓦碧如鈿海日欲上山禽啼村童掘鼠拾斷㦸漁父髙歌悲故堤猶傳天寶盛烽燧軋犖山人貪艷妻汾陽血戰祿山死杲卿義名恆嶽齊時移事去陵谷換車轂年年下長坂草色猶連碣石青濤聲豈憚滄波逺武靈臺下春雲生董相原前秋露明誰家牛背橫短笛髙呼一聲千古情秋園露華綴草秋離離回風捲葉揚赤旗老槐團團翠如蓋山鳥欲下驚曲枝自臨古井牽素索農圃滋味須吾知平生骨法本貧賤謫仙福薄王濛癡安能久躡名利場猛虎赴塘當無疑雖非祀竈可郤老庶幾服息能忘饑籬邊寒蛩忽唧唧滿林秋色正葳㽔為君痛飲三百爵醉待明蟾生海涯神樹行我家墳上老白楊風摧雨蝕分枯朽一脈才存天地性十年更作風雷吼崛起似有神明扶發榮却在凋傷後路傍行人坐歎息此事依稀古曽有上林髙栁僵復生田家紫荆悴重茂間關海嶠存遺孤斡轉乾坤賴貞婦豈獨義擬衛共姜自是忠同晉杵臼秋霜照膽繁本枝幽谷回陽保長久龍皮屈律張萬鱗虎骨聨拳露雙肘氣排霄漢春愈滋勢壓郊原地增秀陰功自得天維持世澤誰知自忠厚臨風瞻拜思不窮更祝多男與多夀有所思東風二月揚新沙憶醉燕南豪士家狂歌劇舞共春色正值東鄰桃始華情䦨每厭筝笛聒意放不遣山林遮船頭詩篇船尾酒解纜直下清溪涯太原喬生興踔絶偏愛漁簑冒風雪杯空正自吸流泉月出先判宿巖穴封龍山人意原苦坐覺悲風起尊俎鬢星豈乏長安塵衣斑尚帶西湖雨百年離合江上雲萬事紛紜江水紋千里夕陽春草緑停雲空憶鮑參軍秋塘曲長陂水落魚龍冷芙蕖墮香菱葉靚采蓮猶繫青娃船萍藻中間照粧影岸上人語積漸稀羅袂掩面踏船歸亦知明年荷復出但恐緑鬢失芳菲人間白日不重午黃金自可當年揮悲歌一聲下江渚回頭更見鴛鴦侣落日悲風葉亂飛藕絲愁緒俱千縷招隱詞秋山慘栗兮吾土肥園蔬畹藥兮猶光輝路餘菅兮可緝屨池有荷兮能製衣山中之美人兮胡不歸秋江兮白蘋緑波起兮魚鱗鱗吹長笛兮激丹唇鳥盈盈兮雲紛紛胡不歸兮山中之美人吾尊兮有酒呼明月兮當牖緑竹兮與鄰清風兮為友美人樂兮且久緑顔兮皓首望蒼巖行蒼巖之山在何許大行東來如馬駐上有千年不老之長松下有清泉及茂樹顛猿棲其中千嵗亦不去𤣥鳥吐雲白鹿走異相不獨隋帝女山翁飲水猶緑髮野草通靈亦金縷吁嗟乎佳哉名山神仙直在天壤間我欲從之問大還路逺莫致行苦艱但見淑氣擁丹閣竒峯歷録青如環百里之外且如此何況暮宿𤣥圃朝洧盤人生不滿百日月凋朱顔安能不行樂苦為名利慳到頭鐘鼎亦徒爾眼前行路猶間關君胡不歸來山水有餘歡吾為汝致安期棗更為汝栽武陵花黃童髙歌素女舞同醉吹笙王子家溪亭溪南小亭清且孤漁父送酒剛百壺水風欺人雙鬢短飛瀑不救詩腸枯輕帆翩翩進復却蒲梢初長蓮未萼惟有楊花恨别離化為萍草猶飄泊浮生百年無定蹤太平景象長雍容不妨爛醉卧溪上夜聽黑潭鳴水龍灌木詞灌木萋萋兮露既濡草抽萌兮楊垂須岵不可陟兮屺不可踰白日皎皎兮下丘墟神飛越兮道阻迂仰歸雲兮不能俱園有桑兮巷亦有車嗟祀事兮弗馳弗驅隕涕