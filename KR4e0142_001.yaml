body:
  text: 熊峯集卷一明石珤撰詩五言古送楊提學應寧蚤聞伯起譽亦欲摳吾衣長風振郊壑雲龍忽分飛仰止徒髙山而勢不能依文章絢圭璧日得窺餘輝臯鳥倐一舉淵魚遂其肥道合志乃同此意識者稀所以淵明琴不在弦與徽京國再相逢蹲豸有餘威一展疇昔願清論聆霏霏灑我塵埃襟登之清風磯雖非暮春姿忽爾吟咏歸何怪公門人器識俱可希公門有青驄行色動朝暉安能一束芻聊以駐騑騑晨星本易散流雲亦易微遡彼西北風兹懷良不違旭日春耕為閻大參賦東方白已發壟畝明浩浩不辭荷耒倦穡事貴及早道逢同心人勞問亦草草共言年穀登百嵗可相保秋日遣興旭日戒僮夫駕言適東野市朝垢心境廣莫快一寫況值目疾除秋色尚可假豈徒望封龍巖壑翠堪把近觀百穀繁一一含大化我雖宦遊人自是悠悠者忽逢鄰叟來相歡坐桑下寄兄舊作寒空變春雲奔驥逐迅景君看宫前楊忽已露碧影幽居西窗下感事發深省誰言有為者譬掘九仭井盛顔易消歇此道獨未領空奏郢人吟懷抱殊耿耿吾兄繡衣使仗鉞指西境清詩賞風流正論崇骨鯁寄言願相朂共此百嵗永鼓不絶鄰巷相見語兹農薄收成何緣纍旬日簫鼓未絶鳴東家男已長西家女將行羔雁來問吉雞豚往通名置宴召賔侣責逋急官征斛粟易百錢入坐恐未盈花顔照四席典客稽考明布帛身不著妻子徒力耕違俗懼乖義先王近人情歌管沸兩耳中心悁且驚但見蟻杯緑不知魴尾赬憑君聽簫鼓中有勞者聲怨歌行珠人本中國萬里向海陬結網沈洪波深入黿鼉湫珊瑚由寸積驪龍不易求百死冒霜霧纍年被淹留舉手得夜光寶樹照斗牛三獻入漢庭聲名動九州日往嵗亦徂忽生瑕纇憂長恐棄道側勤苦不能酬豈惜寒與飢懼貽重寶羞中夜起長歎淚下如泉流春日即事林塘鳴春鳩忽忽過穀雨繁紅多辭柯緑甲半出土魚欣荷錢青鳥悅石髮古凌雲思髙臺對日作獨舞為生良支離被命孰傴僂悠然東風來兀坐聽杜宇飲鮑雲瑞莊城栁初盡處薄靄開空明潦降古洲出千里關寸情斷岸帶芳草逺樹啼殘鶯釣艇日往還或有羊裘生下馬對尊斚故人相與傾坐久出歌舞柔風濯長纓落霞酣野色吟蛩戰秋聲長恐西日下衢路立屏營夜渡滹沱西日光已微跨馬出村境唧唧林鳥鳴仰見河漢影南巡古堤麓地峻行屢警踏軟知近沙野濶夜逾靜誰將笙歌耳復聽秋蟲哽萬事倐春夢對此山河永驚波嚙斷岸跳梁老魚猛星斗搖長練薄吹搜鬢頴鼓枻歌滄浪懷人憶千頃遙望城西門熠熠煙火冷秋夜涼夜始多夢升沈頃相尋蟠蟀入牀下蕭序已載陰褰裳出庭戶河漢清且深華月挂林杪髙鴻送哀音百嵗豈不多半為風雨侵嗟彼蝸角名煩此孤鶴心流水激古洲髙山出逺岑子期果難逢獨卧枕素琴蚤起城陰苦寒沍積雪冬未消日夕人馬馳流塵亂瓊瑶抱志諒猶潔凌風詎能飄徒然漾空月皎皎射窗綃野客官大都雞鳴候晨朝卧聞車轂聲軋啞上干霄起披黑貂裘啓明正搖搖竦踊不能寐曳珮趨午橋寄羅汝實寒齋坐無事對此春晝雨雙鴻自南來流韻落庭廡起尋故人書别緒那可數春草南園緑秋月西林吐歌詩每達夜笑噱曽過午雲龍忽乖張感物益悽楚何時倒清尊共醉恆川滸雨中寄白文明開書復開書雲影照顔色東風昨夜至渠栁柔無力雖有龍泉劔袖短時拂拭時人競彎弧古道惡弦直聖王崇舊儒不忍棄一得漫隨東觀班豈有圗南翼經書雖滿案抱病長憂惻遙見孤雲飛佇立而歎息新婦詞醜婦羞見姑終難不上堂雞鳴理針帨對鏡著衣裳薰沐再至三稍覺有容光長跪問起居顧影尚倣徨大人總家政百務惟德將舉手能績麻出門時採桑辛勤無日夜歡喜動姑嫜入與諸姑遊諸婦日翺翔愛璧不見瑕度材或惜長邦家本一致竭力安可忘章錦衣園餞克溫惜别駐郊坰名園及璀璨朱榮懸弱葼清樾護修幹載展夙昔歡頗興萍蓬歎觥繁亂回波坐逸何泮渙妙舞出京洛清歌徹雲漢探幽入虎谷躡蹬聳飛翰幾欲凌長風六極遊汗漫主人愛真景廢榭臨斷岸豈惟示朴淳正欲知憂患吾儕睹落葉朝聚夕又散當時盛紅顔幾許髮已換安知垂汗青試聽歌石爛願言保終始慶雲旦復旦雜詩妙舞恆赴節善歌多應弦藝精契至理輪扁非言傳情矯性始鑿禮煩本日顛所以大觀人遊目無為先豈不笑與嚬造適意悠然投足得規矩率真外蹄筌庶幾達聖境併可延天年雨坐述懷結髮事竒謀年徂志彌逺雖蒙簮紱榮抱病日長偃興到偶翻閲吟哦不終卷古來忠與邪往往激褊淺長城能自壞元惡疇克殄所以樂道人但欲脫軒冕境大意自舒身安慮長鮮此理本分明不用更輾轉雜詩大朴已雕散頽波漫末塗箋誥日紛綸君臣互為諛直弦忽見絶白璧多掩瑜但聞都俞聲無復咈與吁往往抗顔色猶稱邁唐虞唐虞不可見烈士始全軀王掾名癡絶槐里號狂愚安能起臯益重述邦家謨春出西郭門芳郊艷春陽百卉待蔥蒨念我多悲人如何及遊宴聞鴉墮清淚睹草增眷戀豈獨感蓼莪正自哀衣線仰天恩罔極銜慟髮先變愧彼九臯禽和鳴徹霄漢擬古閲世貴知忌骯髒始多愆趾發物已忤意行悔相連苦抱叔夜僻誰辨箕季賢坦枉固有分直絲寧改弦豈不悟裸撾賈禍几席前鴻鵠各負志輮方豈成圎出門欲學步足亂首忽顛何如執堅貞嵗晏循固然王道本寬衍鍥薄世謂良鞟革大始裂箠軛齊已僵雖剔毫末疵不顧根本傷譬彼几上琴軫急寧久張中行任智敗季孫以斂亡覆車鑒不逺胡為復周章廟堂宜有樞開闔道始昌憑誰用楊綰暫為輟絲簧熊耳峯封龍山勢壯嶻嶪見熊耳髙峙層霄間下聽幾千里威深貔虎避意拔雷電起乃知天降靈自與凡石異浮嵐出晴丹淑氣凝夜紫倣佛懸崖旁呵護有神鬼我思漢三老幽谷訪遺屣人去事亦非荒池但秋水地靈應未散烈士還繼軌遙遙白雲中何人隱髙几恭睹臨雍釋奠敬述以詩璧水晨漭漾石壇花始垂雲開大成殿檜柏鬱葳㽔盛王重孔道祼獻皆親持簫韶切雲漢八佾盈階墀禮成進諸生講席命爾師敷陳唐虞理論説羲文辭坐久進珍茗雨露必旁施三氏既榮耀九卿亦華滋東瞻學士班文采何陸離各斂補衣手默默猶論思斯文日中天志士正揚眉送王司徒分韻得五字在昔稱髙士箕山及巢父雖垂千載名吾道固未取君臣義自重豈得薄圭組惟是勳業成幾微貴先睹二疏辭漢榮季鷹懷吳土司徒志亦然百世殆同矩辛勤三十年出身事清主行者必有歸安得長傴僂明山有茅亭亭南有瓜圃象觀有卷舒理玩月三五始息負重肩時與荷蓧伍睡足江南春無人報風雨夜至張秋日暮出荆門夜行復十里半帆乘順風一篙得春水篝燈危檣末餘映徹洲沚逺逺聞犬聲漸喜近井市纜人相和歌飢渴被驅使恨無濁酒勞畢力共王事擬古二首江北好風花江南好魚米北來南去人好謝長江水其二風發吾舟停風停吾舟發誰知乘舟人正是觀風客過沛望歌風臺三王久不作淳風變縱橫兵戈入戰國耆宿填秦坑天賜赤帝子龍泉定升平豈獨體貌異聖度疇與京功成歸故里慷慨道平生意氣自雄俊歌詞亦峥嶸至今千載下聞者心膽明是宜冠庶物直與商周并帝子乘龍升故臺未全平臺下春草緑時鳥間關鳴猛士安在哉四海復永清仰見雲飛揚遡風有餘情送王尚書德輝還餘姚五首杳杳稽山青茫茫舜江白意倦行且休身存嵗寧迫唐虞世已逺孔孟道未塞長嘯凌秋空黃花正盈陌其二吾行何所求青山映華髮板輿傍春花清波濺仙襪功名一炊黍人世幾明月歷覽千萬秋百巧未如拙其三春花豈勝秋新人不如故紛紛紅紫羣酣艷良未悟千金買馬首百罔捕毚兔一曲雍門歌夕陽在髙樹其四塞北多歸雁江南有去人塵寰回鶴夢神劍斂龍鱗童冠同三月鶯花又一春羊裘灘底在吾欲問吾津其五試看春花萼朝來枝上疏有形寧免化何水不堪漁道德五千字豪華十二衢寸心應未減長拱帝王居送馬汝礪山隱隱兮蛾眉草蒙茸兮緑髮送君去兮南浦君之情兮北闕曰有罪兮薰天宜祝融兮鬼罰念莫撲兮燎原悔厝薪兮直突孰解網兮縱豫懸明照兮日月牛刀用兮雞豚宛駒變兮䘖橛日窅窅兮飛鴻秋蕭蕭兮縱鶻廬江兮悠悠黃堂兮突兀此判兮不改臣力兮當竭延北望兮瀛洲儼瞻雲兮擁笏君恩兮碎首父誡兮銘骨身則逺兮心邇孰朝寧兮巖窟送王伯安還江東吾欲歌吾詩歌詩已盈卷知君歸駕速不作題橋炫春蘭與秋菊萬事類輪轉未成山龍補且息鵾鵬倦人從日邊來豹向山中變長路多西風看雲亦北面誰垂見花淚自鏃達犀箭國士稱無雙數竒本能戰況聞玊署翁昨侍青宫燕神驚兔頴出目擊龍頭眩君學有源委文場許獨擅髙吟激青空逸草翻白練運斤忽成風疾足詫追雷志屈藝乃竒才髙君不見伏波窮益堅淮陰多益善木大須十圍金精亦百鍊巍巍蓬萊宫鬱鬱白獸殿看君來獻書首被賢良薦送王僉憲分韻得事字出門仰青天千里見孤翅噓氣成采霞百鳥不敢企借問希有鳥南遊欲何事一蜚歷江海再舉掠恆冀來遊大韶庭雍雍領羣瑞亦有阿閣顛故巢尚深閟帝許中翺翔銜書澤憔悴鴻鵠豈不髙鷹隼豈不鷙一鳴天下春所貴在純粹何異君子登快睹歆士類鳳兮盍歸來德輝正光被秋風吟驚飈振修麓稿葉下喬林怒號捲積靄急轉楊輕砧翩翩孤鳳雛託身芳樹陰中夜感簫韶激烈發清音下有抱貞士聞之援素琴一彈南山髙再彈流水深離鸞與别鶴嘹唳聲相尋律吕轉清切壯懷佇蕭森誰言人生貴無異巢中禽得時應春鳴遇寒亦哀吟萬動各有息睹物悟人心服我敝緼袍安知辟寒金擬古秋夜何迢迢蟠蟀鳴陰壁蟾升林薄見露下庭宇閴螢火寒依人羸駒倦嘶櫪開襟納虛明萬事謝欣戚題林郎中瞻雲卷南望烏石山白雲何悠悠下有仙人居玉宇對瓊樓開籠縱白鶴鑿沼盤蒼虯樓前樹蘢蔥結實長千秋仙人不下堂白髮初蒙頭養雛能沖霄一一動宸旒銜來五色書閃爍銀垂鈎大雛奮四海健翮橫九州小雛鳴朝陽逸響和鳴球仰窺白雲飛悵然念逺遊開軒列屏素遍與良工謀圗兹一寸心聊以紓百憂南山突兀起海水東南流長松聳孤翠陰壑風颼颼王母開瑶池旨酒復嘉羞紫氣浮霞觴宴集多仙儔酒酣迭稱夀屈指不計周笑指海上山消搖發清謳觀麥步出城東門微徑南迤邐騁馬歷磊確春光何靡靡蘇紫及藍黃瑣細不足指引睇耒耜外牟麥方薿薿晴浪淺不揚頽雲互偃倚驚烏驀然飛翠色墮欲起萬旗森摩戛力與東風抵苞桑繫髙畛宛若大將壘馮虛縱遐矚詩興勃填委朝霞餐未饜清颸歷牙齒馬上揖農夫願言滌兩耳年來有司良民得展四體去冬雪何厚膏澤尚漫瀰朝夕時雨降足食良可擬感兹芻蕘言志動氣亦喜揮鞭聊一吟慷慨殊未己月夜同諸友歸自徐村驅馬臨髙臺月色瑩如鏡衆星吐寒芒東方橫斗柄宇定光自發林深鳥相慶驢思棧豆鳴人有歸風詠吾曹際明時為道俱希聖貧同一瓢顔貴比萬鍾孟所重在操存原思果非病譬彼道邊木枝柯何枯硬白日發榮華春條漸繁盛吁嗟枯易榮豈不由正性飛雲無長停流電無久映今我不馳驅嵗月忽欲竟擬君子有所思朝登黃金門暮上白玉堂清飇播柔絃倐忽變炎涼蟠蟀吟苔砌宵行流夜光雲漢懸西南星斗何縱橫唐虞布文德中國奏韶章羣后讓於朝鳳凰亦來翔流音激青霄奮翮向朝陽萬動各飛奔賴此一人慶志士思喪元賢人願垂芳攬鏡照容鬢無使生秋霜不及少壯時攄此忠義腸仰視西日速怛然令內傷田居五月麥風清新蟬占髙栁緩行向南阡延望亦已久露氣濡我裳枯芒森觸手遺禾資貧窶豈獨利寡婦緬思先王時世道何忠厚老死民不流官長鮮迎走終嵗庸數朝方田給十口庖厨雖未豐雞豚養黃耆一自澆偽滋此言遂成否甔石猶不盈焉知肉與酒世降茍如兹吾於爾何有送馬汝礪次韻嵗事如流星奄忽迫遲暮甫愛槐陰庭旋看蓼花渡西風撼秋色況值連夜雨瑶琴不成調簷溜下如注緬懷同心人自昔無藏怒芝蘭許深入蓬藋賴持護鄰芳得屢接家善本多祚壯如百堵幹足以保顛仆亷如千頃波所志在清素文如布帛衣不但形月露直繩置我旁曲木豈回互寶鑑懸我前清輝照門户君去我懸榻我來君倒屨漢禁栁色稠吟情屢相付膠漆方謂堅萍梗乃有數我歸萊子衣君徙廬江路離合奚足云窮通理其固不見閭閻人隆寒出無袴眷彼貴介子裘狐仍舞鷺託身穹壤間何異草與樹溪澗自謂清潢潦豈知汚娟娟如花人恥逢東鄰嫗寧知衆物情長短無定度運改王孫飢時來奴臺飫此事難重陳君子道以助不須叩禪關萬想勞頓悟靜聞發天籟浩蕩如大頀君能久此安胡為不興慕況乃椿庭翁耆儒德猶孺包荒門下士發憤肆傾吐誰嗤吾贈言祗以道舊故秋日寄宋侍御西風吹鬢毛忽忽驚節變疏籬漸飛螢故壘欲辭燕亦有蛟雷鳴中夜捉紈扇緬懷同心人悵望不可見起對庭前花銀河白如練況逢重七日兒女試針線寧知牛與女此夕真歡宴百年離合情忽如萍蓬轉富貴浮空雲豪奢落花片安能不銜杯苦與嵗月戰黃金不鑄身白石不鏤面負此令時節回首嵗將晏原上東風吹古丘白楊何蕭蕭烏鴉號樹顛鳴鳩亦飄颻昔我先世祖挺身自芻蕘種德發餘光甘貧長寂寥源深流易長本厚木斯喬纍葉繼衣冠金門擁瓊瑶誰云髙堂鼎不自陋巷瓢徘徊陟墓道瞻望心搖搖西山鬱蘢蔥爽氣干雲霄荆莽蔽人目草色春含嬌陽和發幽響好鳥協笙簫黍稷各通誠戴白與垂髫念入千載深魂魄良可招登車懼任重橫帶愧虛驕榮華豈不美君子貴後凋謁王滹南先生祠行過數仭宫步自廡南入古祠就荒頓穹碑猶岌岌敗瓦翳緑草頽垣跛而立感此百代人安能不於邑在昔金氏興豪傑稍驅集惟公負雄才辨博人鮮及入掌絲綸言侃侃激懦習砥柱不隨流圭璋有操執著書闡墳典文義無蹈襲鄉邦識楷範後進勞引汲能使綺紈子森然如響翕豈徒富文學自是髙品級下視叨餮徒何翅相百十古人不可作流風振原隰愧我後知人徒然負書笈登堂顔欲汗端拱還趨揖虛位滿塵埃戶牖莓苔澀陋巷諒不改行者為迫急文芒無由睹樹杪光熠熠題長春軒詩卷春陽無恆燠春雨無恆滋如何軒中人日詠長春詩豈有師文絃如彼魯陽麾至哉萬化源舒慘固自知庭除辟餘壤百卉紛及時春蘭色可悅秋菊亦垂垂修樹交清陰好鳥鳴髙枝俯窺華實繁仰視風霆馳吟嘯皆春風習習被朱絲有時掔墜露咀嚼療晨飢乃知廣文飯不異商嶺芝平生執經人廟堂今設施珍重蔥鬱間或有棟梁姿古别離曲官楊何青青野花明道傍妾東君向西坐見道路長留妾千金刀贈君雙鳴璫日月如流星嵗暮永相望雜詩涼風動書幔倣佛西南來庭柯下露葉哽咽遞相催瓜蔓滯宿雨裊裊蒙塵埃草蟲階下鳴流螢亦徘徊坐感嵗事速忽如車輪推門前有層城層城復髙臺乘風欲登眺仰遡天漢回帝子不可見青鳥非良媒中夜耿深憂淚落秋生苔逢太原故人浮生易飄轉忽如車轂塵與子十年别念君如舊貧感慨奏詩篇況復屆陽春為問城中景一一及交親白璧猶待價巨魚多戢鱗昔時富遊子忽為寒乞身荒蕪積水處時見紅樓新賤子負干戈依然羇旅人遭逢太平年幸免罹苦辛感此人事變對談忽忘真池上良辰不易得池上一來臨微風感新緑幽蘭欣客襟方洲語鳴鳥忽如鼓瑟琴悠悠南行雲成此匝地陰美人隔千里贈我百煉金我有錦綬帶願言結同心漫書二首嶧陽生孤桐弦之以吳絲坐令風雨色變出陽春詞可以養聖性可以獻帝墀孤髙諒有合君丁貴後時其二曽子日在野食力事躬耕納屨踵時決掩肘襟不盈豈無百鎰餽乖義色所輕天光觸鳴籟商頌出金聲終焉領聖業千載崇巨名秋夜蕭蕭暮秋意似與騷人期西風凄布袍河漢影垂垂髙城奏清角感愴有餘悲故壘欲辭燕殘蟬猶附枝烹羊及炮羔農家欣及時不念抱窮士文章光陸離忽觸秋濤聲壯懷良在兹小園雨後二首新雨膏炎壟逺風滌繁林取涼李井上仲子迹可尋玄駒下危垤屈蠖鳴幽陰萬類均一適忘古安有今雖復病兩眥稍在愜孤襟密雲焉久留素石悟同心其二夏木豈無陰古井亦有泉陰疏僅自庇泉苦得永年羲黃世遼邈疇與論自然稍喜禾稼成藜藿比醲鮮浮生能幾許沈鬱貴自宣偃卧轆轤側南風勻樹弦夏夕暮色蒼然至涼思淡盈襟坐閲古人編稍見古人心遙岑出天末薄靄凝夏林羣動各有息衡門幽且深擬古翩翩海中蚌長養非一朝含靈向秋浦出沒隨春潮展月夜咀華精爽洞丹霄孕為徑寸珠光采兼瓊瑶逺人致筐篚萬寶坐自消本期綴冕旒何意投寂寥聖王惜合抱尺朽安足嘲寄所知昨夜清颸發懷君在逺道雙魚不可託寂寞對池草寒露日夕凝林麓霜苦早誰念裘褐單泥滓難自保百年會有樂中嵗已枯稿如何日孳孳復為毫末惱濁酒幸滿尊藜藿亦堪飽同心盍來歸盤桓以怡老五月朔日獨坐風日昨炎燠坐睹麥秋暮青山當户牖黃塵滿岐路旅舍亦宏敞夕陰舞嘉樹羈鳥恆思歸舉翼未能去極目西南天哀鳴亂幽緒春日雜言長空多浮雲微雨霑四郊美人隔蘭渚雜佩不可要去年梁間燕今嵗將尋巢時物各芬芳吾興亦飄颻珠箔障東風星月耿深霄欲理陽春詞朱絃為君調二十五日有作悴葉看復脫逺聽無回音美環墮石砌破碎安可任平生氣頗逸不受萬事侵幾因兒女曹折盡壯士心南舟駕言邁先壟行復尋感此重悽惻何用榮朝簮牀頭富緗紩囊中有素琴恨來煮白鶴放歌青松林漢宫詞漢宫有明月秋風悴碧枝紫苔繡壁帶積翠隱罛籬夜久星河變人來鸚鵡知舊恩隨露瀉餘歡與日移尚憶朝辭輦深承夜誦詩陽阿新得幸谷永況多辭指斥椒房寵吹求飾室疵榮枯付階草物化效氷澌無言掩明鏡千古妬蛾眉熊峯集卷一
