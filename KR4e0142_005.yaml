body:
  text: 熊峯集卷五明石珤撰賦經丘賦頃在田畝始親稼穯徜徉丘壑亦足歡虞乃知七者之作意非止於逃塵三農之流事亦兼夫適志樂則生矣而豈徒哉昔人有言佩玊而心若槁木立朝而意在東山竊嘗病其失出處之幾為依違之計既非懷藎以事君亦豈樂道而忘勢以今觀之他人有心其則不逺容有若此者也因感淵明﨑嶇經丘之語乃作兹賦以寄興焉經髙丘以騁望兮獨延佇而徘徊遵臥龍之長岡兮陟呼鷹之故臺覽宜安之廢墟兮拾兜鍪之繡苔懷珠履之繽紛兮悵頗牧之不來方全趙之有國兮固用賢而得士掎東壤之雄狐兮扼方城之封豕雖韓魏之近交兮亦勤平而屢盟彼暴秦之虎噬兮又何怪乎縱橫屈澠池之一擊兮再奪氣於連城終將相之立朝兮不踰漳而用兵伊振世之豪傑兮徒名存而骨朽宜達人之大觀兮遞託情於杯酒籍既猖而興慟兮康又疏而被戮相五栁之髙風兮若停鸞而峙鵠豫既惜今人之分隂兮又慕往哲之遺躅爰﨑嶇而展遊兮抱山頭之黃犢草茸茸而植杖兮波泛泛而浮舟樂故淵之馳魴兮矯出谷之鳴鷗念逺遊之既歸兮存黑貂之敝裘撫伯牙之孤弦兮感莊叟之犧牛露泥泥以沾衣兮佩凌風之縹眇逢沮溺之耦耕兮遇杖人之荷篠冽清泉之可濯兮瑩石鼓之宜考望唐虞之大廷兮效岡陵之善禱吾聞志士之未遇兮恆泮渙以徜徉茍吾道之固貞兮楚非存而凡非亡抱隆中之雙膝兮銷南郡之隱憂馳九折之畏坂兮凛飛雲之在輈悵蒼生之含望兮蹇東山之漫遊忽青霄之乘路兮展黃扉之大謀則夫成四海之式瞻兮固丘壑之所養或廟堂之潤色兮或江湖之夢想進機衡而霖雨兮退􅀈掌而棲遲惟坎止而流行兮彼蒼蒼其命之乃知參天薄日之老柏兮固何以異於秋菊之垂垂陽和樓賦石子與客登於陽和之樓天光乍開微雨呈霽乃命童子褰蒼筤之薄啓玻瓈之扉感東風之入懷顧兹樓之得名於是左挹瀛海右延大行坐倚恆嶽前臨清漳覽全趙之規模辨先王之舊疆睨亷頗之故壘得平原之廣堂問屈秦之相如悲易老之馮唐固皆一世之豪也而今已矣乃有拔茅而起承筐是將大夫濟濟諸侯皇皇文身魋髻隼旟鳥章繇九州之大陸駕萬里之飛航楛矢貢而至肅愼白雉獻而走越裳豈非聖人在位服教化而觀重光者乎豫趙士也能為髙歌客秦人也雅善擊缶於是引滿浮白按歌而鼓之歌曰俯危闌兮橫素秋日光華兮海安流望卿雲兮知帝州惟帝子兮不可求吹參差兮麟鳳遊歌竟復酌天風吹衣暖響不流雲翔鳥回想虞韶之遺音呌閶闔之重圍山嶔嶔而改色水潏潏而湍飛擬蘇門之清嘯轟轟乎若栗虎豹而鞭虹霓蓋樂而忘歸也既乃客謂豫曰萬物之幾有動有息動靜隂陽互為其極繄兹樓之肇興幾英雄之覽歷或憂國而屏營或畏禍而怵惕固嘗攬衣而起擁檻而立矣豈意吾二人者之來遊值升平之暇日念髀肉之易消惜流光之過隙恐後人之視吾猶吾人之視昔也噫嘻子其知道也夫時止則止時行則行萬鈞匪重蟬翼匪輕簞瓢匪賤軒裳匪榮或隆而棟或植而楹固萬物之常理亦造化之權衡居吾易以俟命亦何事乎營營後陽和樓賦余獨有此逺志兮好廣覽乎紘埏躡凌雲之危梯兮俯滹沱之長川惟此樓之橫跨兮當定鼎之季年逾十紀而更新兮借寇君之晏然繡閣逈而翬飛兮豈觀美之故也歷日月而捫參井兮得璣衡之度也銅龍咽以應候兮波瀠回而來遡也鼓隆隆以逺響兮杳不知其處也聽踆烏兮乍鳴海日出兮波騰見征夫之先路兮士夜寐而夙興商抱貿而欲集兮有晨耕之老農固厥志之先定兮賴咨謀之僉同鍾鏗鍧以相和兮或逺達於公宮角凄其以回飈兮訝鴻飛之嗈嗈值吾生之多暇兮朝來遊而來歌酌桂醑而進蘭蒸兮睇長洲之芰荷層巒拱而送秀兮星漢回而泛槎鶴翩翩而長吟兮木蒼蒼而孔多伊陽和之佳名兮誠取義之有以斟元氣而既平兮放雄襟之危􅓓挹晨曦於未明兮納夕照於千里雲溶溶而棲甍兮雨霏霏而沾几地既靈而人傑兮民亦安而物庶下行郡之襜帷兮駐澄清之髙轡驚邑野之兼謀兮揖江山而助豫運折衝之籌略兮見輻輳之車書及天下之先憂兮樂風雲之有餘乃若志欲展兮意欲達懷千里兮望明月慫長劒兮佩金玦橫霜笛兮感華髮覽燕趙之遺墟慨英雄之舊跡非決清漳之波以為酒弦山隂之竹以為樂起九河之蛟鼉以為舞號萬籟之風雷以為歌有不足以厭其跌宕未平之氣也又何欣欣乎噫嘻秋菊兮晚榮春蘭兮華滋南陽兮不逢渭濱兮非遲保天倪以自怡兮苟萬物之有時返吾御於六極兮陳登臨之漫詞滹沱河賦介然子將如東瀛放舟於滹沱之浦覽郡國披山川辨土壤聆風泉俯象六極仰窺無垠問遺俗於故老招海上之飛仙於是揖漁人而進之曰子亦知夫兹水之源乎出自繁畤經於代谷放乎鴈門之坂帶於太行之麓朔方巨嶽實扼其胸恆衛諸流半入其腹氣吞萬壑激硊􅓓而未平勢應三泉墮平原而逾蹙時乎春冰乍融積雪方解支流趨順客浪藏駭迂回縵延千里一帶霤石成渠鏘波赴海千城藉其潤色萬畝資其灌溉鏦錚鳴帝子之環嘔軋散將軍之凱編桴賈客燈火輝煌罷釣漁郎歌聲欵乃芳洲乍晴倐昏忽明掔神農之遺譜得靈均之杜衡及夫積霖未止秋水大至巨濤坼空駛溜軒地律令助威飛亷擁勢海若為之改容巨靈因而避位鯨翻渤澥鬼母長呼虎栗昆陽英雄失智山刋菑醫野誅朴􅈪先驅一指崩沙潰屋怒留城邑薪藁如雲殃及鱨鯊僵尸遍谷亦有傾城摧山變陵不雨而怒無龍而興湍隨鯤徙勢若雷崩斷岸蒙隤殷輪乍赤平岡被嚙戈㦸猶青雷崩斷趺訝魚龍之識字渚留袍笏豈犀火之通靈乃有泗濱磬浮汾隂鼎見寶鏡入秦號鐘歸梵涇陽嫁女簫鼓猶喧龍叟射綃波濤飽戰壞百尺之長橋剗千年之古塹人懷魚鱉之憂國有沼池之嘆忽幾劫之餘灰出昆明之一旦蓋自列國兵屯朝齊暮秦盟渝韓魏兵來薊門趙國上卿功名一擊平原公子車騎長奔虎狼勢成合縱事緩頗牧既亡望諸已晚建不出援丹空起變常山之蛇陳徒存主父之龍顔幸返復有劉項相雄赤旗建功淮隂故壘東垣廢宫王霸詭冰再光舊版蕪亭麥飯猶著遺忠保河北以待朕亦何異於關中乃至開元弛綱漁陽肆毒投鞭斷河驅王入蜀常山太守首扼天下之吭帳下猪兒竟破祿山之腹惟宋有國兹當北垂契丹伺便西夏來窺築筒梁津任布有備邉之策山崩海覆劉竧興致死之師自餘紛紛以暴易暴中更幾巡世歷多號劉琨有志獨枕長戈虞詡難逢空增萬竈太平之日少於戰爭中區之地半多鍪帽是宜地下白骨多於黃土長河東奔為泄其怒摧車卷甲蕩百世之餘凶濺沫飛流刷遺羞於千古山蓋不得不峻水蓋不得不駛陵谷蓋不得而不變城市蓋不得而不徙是雖天時人事交㑹之偶然然亦豈惡殺好生造化之得已者乎乃知天本待人地亦藏宅界我祖宗增其式廓既定鼎於金陵又相居於恆嶽若成周之豐鎬復營邑於伊洛挽唐虞三代之遺風掃爭戰百年之餘虐於是山多獻靈川亦效職噓氣成雲蒸地得澤不須劉纍豢靈沼之二龍亦有豫且得白龜之徑尺木多杞梓自河而東波有鰋魴望海而入其有異氣藴鬱孕為賢良輝煌事業璀璨文章髙門大纛紫綬金章或名流乎林藪或身負乎綱常乃若蘭陵著述功禆墳典文貞諫論治逮成康閣敞平津屢屈吾丘之博辨屏張便殿猶存李絳之封章武惠忠誠身兼將相韓維兄弟並在巖廊趙賓客之名懸調燮黃牧伯之風挽循良一代龍頭世頌文忠之相業兩朝司馬名登恭敏於旗常是其在昔有作于今益昌孰非山河之所鍾育地氣之所敷揚者乎矧吾生之行休值海波之方晏駕木蘭之長舟縱千里於遐覽橫桓伊之古笛飽亷頗之一飯籍荒磯之芳草憩清風之别館采江離以為佩畦揭車之九畹悵九原之莫作想古人之如見於是流魚出波沙鳥鳴苑月華窺林露色凄晚樂未極而悲已生日已夕而路猶逺既引領而髙歌又一唱而三歎浩浩乎飄飄乎蓋不知吾之所欲之而忘吾之所欲返也歌曰山窅窅兮波鱗鱗臨長洲兮思古人魚來迎兮鶴與吟惟秋鴻兮北以南志不可騁兮樂不可單還豫舟於江臯兮吾將續先王之遺音登封龍山賦石子抱病登於封龍覽燕趙之墟望滄溟之浦慨然太息顧謂二三子曰美乎休哉此陶唐氏之故都也巨嶽雄峙長河駿奔崇岡復阜如抱如蹲萬壑潨流滙為九澤大行崛立溢出平原川橫夏后之橇地藏虞舜之璧八年於外地平天成五月朔巡諸侯萬國天文别野星當昴畢之區土壤分州域界幽并之宅川紆嶺回鬱鬱崔崔峭壁聳秀丹峯凝輝晴瀑挂百尋之長練顚崖轉萬谷之驚雷上有蔽日干霄之古樹下有陵遷谷變之寒灰俗有避秦山多入晉嶽被重封川經幾濬虎嘯風冽龍行電迅寒烟色舊李躬燈火之臺右石光寒季子合從之印萬里交乎胸中千巖縱其一瞬其東則古之大陸也波洄鏡縈曼衍鏗鍧茭蒲芰荷肅乎風生海鳬來遊鵁鶄互鳴放乎觀津之野帶于平棘之城漁浦流歌廊廟隔江湖之興秋郊舒嘯英豪含感慨之情竇氏青山馮唐故宅納牖進言引巵正色園成茂草逢下帷之董生饁有髙賓見耕田之冀缺人傳擊筑之歌士有談經之業貞觀章疏一代忠良稷下遺書六經羽翼疇非治望乎唐虞豈獨事關乎列國其南則漢之巨鹿鄗中也臺隍尚存煙屯霧昏想興王之舊業或寄跡乎荒原蕪蔞存豆粥之亭滹水望冰澌之渡北道主人塵埃物色對竈將軍雲龍際遇地存京觀李華興弔古之詞士遇清時文達展登瀛之步亦有閥閲池臺尚存平泉古樹閭里髙門或三世而居司業或父子而握絲綸文妙一時張鷟號青錢之選才優當代衛公陳丹扆之針翺有文章名崇史館絳真宰相官處詞林其西則戰國之陘山也山愈㠝岏水愈潺湲橫峯似劍列嶂為闌平臨三晉遙控全燕車不方軌士可當關料敵機危痛左車之不遇燒丹火伏訝隋女之登仙雪霽西屏冰封璧合雲銷抱犢墮珮遺鈿誰登望海之亭直下螺峰之境地出危簪天開峻井龍蛇蚴蟉雨自東來麋鹿奔張泉從地湧劉因有志登福地而髙吟敬仲多情撫遺踪而自省篇成寶劒代國神遊文慕香山司空興冷悵九原之莫作幸吾生之登騁其北則古之中山曲陽也峻阜迤邐達於代邊隧通窮漠谷帶長川萬籟號風危城際天士如貔虎人擁戈鋋名寢秦謀共畏亷頗之勇喟興漢髀人思李牧之賢宜安城復再收趙境武靈臺古遙下藩𢎞地存畫卦之臺巖有棄瓢之叟夢得一世之詩豪李嶠諸儒之領袖安平之崔下曲之魏纍代才名靈壽之曹藁城之董一時勳舊朱綸紫綬門地猶雄取印提戈聲華未朽問其士習則樂孝友諄詩書不侵然諾砥礪亷隅氣不可平直欲裂强秦之缶清應有志幾思登孟博之車節奮於窮壯形於老頸可刃而身不可屈頭可斷而碑不可草觀其民風則力織作勤畎畝童稚為婚雞豚娶婦族多辨類等其清濁禮謹送終稱其有無至老猶勤雖貧不困人各守其淳朴俗頗希乎渾沌其尤在可稱者士不妬才人多服義彭亨狡獪雖貴蒙嗤清介端良在微亦貴野無健訟之民官乏舞文之吏上不煩於刑誅下易為乎禁制此固先王舊澤雖經變故猶縷縷而未衰然實聖代洪仁漸染百年首股肱之近地者也所可憾者人不思逺家無素蓄西成遺秉簫鼓連村春事轉空券書絡繹平疇多發冢之夫柱礎有勒文之石民不知兵易為搖動地無守險輕相躪躒蓋自列國之擾五代之亂開元之掠長平之怨谷變千回地經萬戰民無固志殆土崩瓦解遭離亂之孔多俗有俠情豈擊劒衝冠習流風之未變者乎嗟乎燕趙之地先王封建井田之地也燕趙之民先王耕食鑿飲之民也燕趙之俗先王禮義忠厚之俗也奈何世治則有世亂則走晉既東去宋亦南狩或割地以求成或退兵而蹙守使夫河嶽增悲金湯冒醜井里興歔草木蒙垢資壯士於敵國納寇讐於戶牖棄神明之舊城設逋逃之淵藪人不為怪士不知詬亦獨何哉此固有家國者之逺謀然亦士君子之宜憂不然髙門縣薄華冕輕裘致身樞要列位公侯徒因時而補益亦何貴於名流亂曰山有摧兮石有泐疇造化兮無窮極亦何為兮多太息表進實録表伏以河出圖洛出書盛世衍中和之瑞乾示易坤示簡斯人觀渾噩之文故變通有待於神明而作述實開乎睿聖瑤編就緒寶厯增輝恭惟恭穆獻皇帝道本誠明位履中正東平之為善最樂河間之大雅不羣蓋自出閣之年懿範已光於庶服比及分封之日仁風誕布於三湘孝友之化既孚博約之功斯溥謂六經為治天下之具寤寐未嘗忘之以四詩為理性情之書沉潛若有得者牙籖錦帙姚姒居而周孔游玊色金聲賡歌入而風雅出齊明以承祭祀惟祖宗社稷焉依竭力以衛京師則屏翰藩垣是慎江漢篤朝宗之念宮闈傾色養之誠夙夜其勤王家終身以慕父母協重華而陳五事親承孝廟之褒嘉捐千金以犒六師深荷毅皇之尊禮至問小民之疾苦尤知稼穡之艱難每以孝弟力田見於發號施令化行嶽麓五穀登而風雨時意契天衷三光明而瑞徵集事雖總乎一國實則開乎太平蓋帝之心即不顯亦臨無斁亦保之心帝之度即博厚配地髙明配天之度也欽惟皇帝陛下大孝光於四海聖學貫乎百王念天與人歸之不偶然而父教師模之有攸在嘉言善行每拳拳乎其服膺懿訓大謨尚洋洋乎其盈耳爰命詞林之彥用揚帝德之芬史氏述乎所聞賢者識乎其大政教號令多徵諸秦府之舊人心得躬行則定於乾剛之獨斷道因事見綱舉目張魯史筆而為經楚書善以為寶奎章壁翰咸表著而不敢遺日光月華豈形容之所能盡四十年之終始一德千萬世之楷式具存澤衍風流家傳人誦金縢玊檢光生乙夜之觀石室蘭臺芳襲七朝之典聖而又聖心以傳心卓哉執中精一之源流至矣修已治人之實用丕承丕顯文王之業待武王而益彰至方至員帝堯之仁因帝舜而益顯伏願式遵成憲宣厲前徽勤思質諸神明言必法於天下裁成輔相繼二帝三王以成大一統之功祖述憲章運四時五行以永億萬年之祚疏乞恩祭掃疏奏為乞恩祭掃事臣於正德八年九月十七日由國子監祭酒荷蒙聖恩升南吏部右侍郎辭闕赴任路出真定得便道一省先臣丘墓今又歷五年矣嵗受國恩日糜公廩犬馬之誠欲效未能苟溫偷飽待罪清署仰負聖天子拔擢委用之盛心日夕惴惴死不塞責竊念臣祖父丘壠日久荒蕪臣兄玠見任戶部尚書職司國計不得暫曠臣驅馳南北不得隨農圃之子置一觴一豆於春祀秋嘗之辰下負於親罪何可言仰惟皇上以孝理天下封錫寵命悉體羣臣展墓省親無不俯聽如臣之情實在可憫如蒙伏望聖慈容臣給假暫回原籍一省先墓則日月餘光賁及宰木幽明感佩實無窮已臣瞻望慈仁無任懇切之至陳情疏奏為陳情懇乞天恩放回田里事臣伏乞退休纍蒙恩㫖賜留且感且愳不知臣之當何以仰報聖德也臣入仕塗三十餘年少多疾疢長恐旦夕填溝壑有孤聖朝作養拔擢之意今且朽矣幸遇聖明在上言聽諫行於此時而不盡心竭力以服王事以翊太平更待何時但臣章句腐儒無他才技自少至老僅能守法惟兹吏部之任乃宏才碩德廣博無方之士所宜居者臣迂腐狷狹泥法守經每欲毁方非志所好老馬為駒亦復不能誠不識大體誤用人才有負皇上用臣之初志故臣力欲求去冀得賢者輔佐升平茍得其人而盡其才四海永清萬物咸和臣又何求故欲去者非臣之本心也避賢者之路也然臣有一言臣誠得去而陛下行之是臣雖退而志則亨矣夫自古帝王之治莫盛於唐虞帝王之德亦莫盛於堯舜孔子作易曰黃帝堯舜垂衣裳而天下治又曰無為而治者其舜也與夫何為哉恭已正南面而已矣故雖堯舜之聖亦不過得人心任衆職垂拱於上篤恭而天下平也漢之孝文躬行𤣥默與民休息自代承之後不曰振貧窮則曰蠲民租不曰孝弟力田則曰禁黃金珠玊故風醇俗美幾致刑措由是言之亦不過以恭儉率下清淨無為而已又安用多事安用多言哉臣伏見皇上自御極以來殄除元惡即三危羽山之誅召復耆德即九官十二牧之命采納忠言即四目四聰之明達清雪寃獄即眚災肆赦之仁恕詔書一下或聖斷一出朝野臣民鼓舞踴躍鮮有不欲為聖天子效死者太平之論十已見於六七矣故臣愚以為為今之計不過清心省事法堯舜之恭已無為稍用漢文之與民休息而已傳曰凡治道去其太甚者耳又曰天下本無事庸人自擾之又曰為治不在多言顧力行何如耳此三言者雖若簡而無文然為治之道及今日之所當行宜不越此故臣願皇上之力行之也臣又見頃年士風澆薄恥於吏事怠於躬行多務為新竒可喜之論以聳人觀聽無逺慮者以喜隨人又從而為之挽汲臣誠愚昧不達其故然伏而思之未嘗不悲且懼焉何也此風之不可長也昔有周之季邪說橫興淆混名實堅白異同變移人心使天下崇智術黜王道巧於趨避不顧君親卒有戰國之禍漢之東都始於倡義成於附和標榜太繁以名為利使士大夫羞職業尚竒詭薄廟堂之議重私交之語其後亦有黨錮之慘此皆曲儒游士以私滅公徒快一已之情而不顧天下之事縱使祕謀竒計如主父偃吾丘壽王之徒發十難漢朝公卿曾不得其一畢竟於國家何益於百姓何補哉故臣愚以為陛下姑法堯舜之無為文景之恭儉其他議論量加採擇苟無大害於治勿更張可也傳曰巧言亂德又曰利口覆邦家陛下亦不可不加之意也誠如是則無為之治益無所撓而委任之效始可責成孔子論為邦之道而必曰逺佞人佞人殆意正如此尤願皇上以四海為度以終始為謹治有端緒不必責效於旦夕之間事可包荒不必刻意於淵魚之察中才多可用之人不必求備平易有近民之實不必務竒培養元氣不令喜功生事之人自擾於官守言責之間主張廟堂不令竒譎狡獪之辭雜進於虛心受善之下夫以皇上聰明睿智之資剛健中正之德有皇天之眷佑有祖宗之孚感股肱耳目百執事之臣誰敢不為陛下盡力者而天下何患於不雍熙泰和也哉臣仰蒙大恩倘得免罪戾回還原籍幸在邦畿之內為近光之民尚得親見堯舜之治大行於薄海內外也天下幸甚臣愚幸甚臣何敢復言臣朴鄙愚誠志存愛主不計其詞之復兼懇乞休退無任激切待命之至懇乞曲全終始疏臣昧死再乞休致荷蒙溫詔俯留責臣以盡忠報國仍敕吏部差官催促前來臣恭奉詔㫖三復思惟誠感誠懼不知措身之何所也臣少本孱愚不知攝養中嵗病盲視聽俱廢因循三十餘年縻費廩祿仰荷三朝輒賜矜宥積愆纍釁神明致殛故祿日益厚病日益深恭遇聖明龍飛五位萬物咸睹首擢臣掌管銓事旋復進臣專管誥敕皇上登崇俊良惟日不足過聽用臣而臣於君父之前猥當奔走不敢不以情訴也臣本以章句腐儒早入詞苑不親錢穀無勞可見又不折衝禦侮無功可考祗有禮義亷恥一節奉以為事君之資耳天日在上臣益凛凛自保頃在吏部乃有言官論臣納賄及㑹試透漏消息憸邪卑汚蹺蹊等項一一俱有實跡臣實自駭自愕不自知臣之禮義盡隳亷恥掃地至是也既無功又無勞又無亷恥不知將何以立聖明之朝侍日月之側乎夫因一人之譽而自足因一人之毁而自沮自信之君子固不為也但臣愚劣既不足以取信於人實又不能自信徒爾忍辱含垢靦顔在列苟非有伊尹之任真足以當天下之事非有栁下惠之介真得直道事人之體則亦鄙夫庸人患得患失者耳陛下亦將焉用臣哉陛下縱憐臣孑立不使淪棄而鄙夫不可與事君孔子有是言矣臣亦不敢自恕也况臣自奉使回還眩暈健志痿痺等病委的是實前奏具陳不敢重瀆宸聽伏望聖慈憐憫衰廢洞鑒實情早賜寬容許臣休致始也皇上拔用之終也皇上保全之海內聞之咸知聖天子過聽所用之臣終不失為有恥之士臣銜戴至恩死且不朽臣愚幸甚自劾不職疏奏為自劾不職懇乞退休以弭災異事臣惟天人之際不甚相逺有作於人必驗於天上古晝晴而夜雨此無他政得其中而天應以和也中葉滋僞災異始興然當時君臣上下交相警戒少有愆忒不吝改悔故桑穀不榮於修德之朝熒惑遜次於罪已之國妖不勝德民猶賴焉臣切見去冬以來四郊無雪一月之間兩明繼食東作之初風霾輒興積旬纍月日甚一日雨澤不降天地黯慘太陽少光悽風中人小民無知相視驚洶仰惟皇上體念天心哀憫元元敬慎聖躬協於神明申令廷臣同加修省禹湯之自責不是過也天下臣民歡欣仰戴自詔諭以來今纍旬月雲曀萋曖不悔於昔狂颷震撼無日無之雨師屯膏旱魃肆威畿輔地方視逺滋甚陛下英明天縱神武夙成為天地立極為生民立命寧不清心內視略數今日之政有何闕失有何敝漏而致上天之譴怒不息如是乎夫風者天之號令也號令不得其當則風為虐陛下之號令始云有功者賞今豈凉德而在髙位無功而食廩祿者多乎始云有罪者罰今豈忠信而有逮繫夤緣而有脫死者乎雨者天之恩澤也恩澤不得其平則雨失期陛下之恩澤積則成川滙則為淵稿者得之沃微者得之顯今豈有厭梁肉賤紈綺而匹夫匹婦或不遂飽暖之願者乎易曰天地交泰天地不交否傳曰天氣下降地氣不應則雨而為霧地氣上騰天氣不接則雨而為霾今四海之內為陛下之赤子者男耕女織嵗無寧日暑冒湯火冬履霜雪勤勤懇懇以給租稅富室洊空中家蕩産倉府既充用如泥沙冒名者得食濫功者得與陛下亦曾聞稼穡之艱難布縷之不易乎至如裏河一帶臣所親睹原野蕭索人民凋瘁加意存恤猶恐不聊邇來鹺船貢艘一經其地輘轢郡縣榜笞官吏踐踏小民不如雞豚刻剝困窮及於骨髓其誰為陛下言之乎即如目前大河之濱數郡荒歉樹無完膚人民相食守土之官相顧倉皇久始一言即數百里之外如越嶺海陛下雖有好生之德賑發之仁亦何救於溝中之瘠乎天下之事可痛如此者難以悉數陛下試默識而深思之少留意焉去其泰甚使上下之情少得流通則誠之所至無乎不格矣昔者婦寃釋而東海之雨作楚獄雪而鍾離之㴻降劉昆之火滅於反風金縢之禾起於既仆自天子以至於庶人自大聖以至於下愚言行之機鮮有不動於天地者陛下聖神文武逺邁成周豁達大度同符漢祖視四海如家庭待逺人若中國推赤心置人腹人人歡欣得盡所愚誠肯俯納羣臣之言少汰無益之政以天應天何沴不消以心感心何福不致哉不此之深慮而姑悅適耳之言安目前之樂誠恐天下多事大工未巳民不堪命鳥窮獸攫將復有逋逃姦宄竊發草間懲敗往年必且益甚不知偷溫茍飽之臣果可恃其身以翼宗社否乎借曰可恃興師動衆必且不一餽餉犒賞動以萬計斬斷擊伐毒又可言往嵗之事為鑒不逺夫天下者陛下之家室小民者陛下之赤子奈何驅之使亂糜之使盡徒以為羣幸冒僣之資四方窺伺之隙乎此臣之所以痛心疾首欲言不敢言而終不忍不言者也臣一介草茅荷蒙聖恩生長拔擢置之卿二所衣食者陛下之廩祿所榮耀者陛下之官爵知而不言有負國恩神明昭布必且殛罰故不忘區區犬馬之誠輒為陛下言之誠望皇上念天心之不難回念祖法之不難復念威柄之不可不攬念民命之不可不恤查照先朝舊制一一遵行又擇其尤快乎人心甚妨乎國政者即賜處置斷之不疑如雷霆一擊人懷恐懼各保首領以還舊業名分既正倉庫亦省受恩者獲全失寵者不怨臣見隂陽各得其所風雨以時而至日月若濯而光華乾坤若奠而清寧四海窮民殊方異俗亦皆鼓舞於光天化日之下矣臣備員九卿復塵禮司災異不息罪加平等加以素患羸疾耳目昏眊徒竊厚祿實無寸補如蒙伏望聖意俯垂寬宥放歸田里懲一而誡百亦可以少弭災異之萬一也干冒天威無任悚息待命之至碑文嚴子陵祠堂碑亷貪立懦聖之清貧樂固窮士之節子陵所以不乘時利獨行素履視一世而漠然奮百代而崛起者也時夫舂陵唱義昆陽雪恥豪士杖策書生獻符而先生以羊裘釣大澤遡北海之清風有莘野之樂道及夫形象旁求旌纁交致築野肖傅解衣衣韓而先生以客星犯帝座乏閔騫之辭讓為子方之偃蹇於戲孔子惓惓於哀定孟軻汲汲於齊梁莫不欲拯溺救焚濟時行道而先生遭遇仁明之主竟為阻絶之行茍非有以深見帝德之不廣豈亦得聖人之清而不化者與然使其時士崇節槩俗尚亷恥忠臣義士視死如歸國有清議係桐江之一絲人多全節接嚴灘之七里則又莫非先生啓迪開導之也先生舊有祠堂在桐廬嵗逺圮壞縣令某益新之屬余為文將刻之石聞風欲起遊聖難言瞻彼崔嵬徒仰富春之髙致慨然歎息復慚文正之雄詞銘曰新室毒流恥為祿仕山深谷幽遂膠厥志世祖龍興響合雲從縱橫玊帛旁致形容咄咄子陵相助為理草茅故人堅臥不起圭組包羞孰與羊裘駟馬貰患孰與田疇先生倡之後來和之睥睨垂涎漢鼎賴之維公之風與公之節江水雲山或莫可越奕奕新祠在山之阿耿耿清光終古不磨記滹沱河記恆山之陽有巨川焉曰滹沱源出代郡泰戲山下滙為三泉流稍延曼循大行掠晉冀蜿蜒而東注之海按班固叙禹貢九河所謂徒駭者是也至宋蔡沉疑之蓋亦惑於夾石碣石之說遂以九河皆淪沒於海滹沱中髙不與大河相涉非之夫九河固淪沒於海九河之源豈亦淪沒乎滹沱固不與大河相涉然所謂九河者亦猶九川云爾豈謂大河播而為九乎故知山川經絡茍非目睹身歷而欲據文字定之鮮有不失者矣是則滹沱亦未見其的不為徒駭也顧太行以東地勢頓下且河道淤沙窪壅不常旁無澗壑以泄水怒故霖潦相仍山谷諸流叢奔㑹趨洶湧而至敗城郭沒田廬其害有不可勝言者今禹貢舊道既不可見而西漢於此置蒲吾渠通漕船亦湮滅無跡豈非亦以兹水之害甚不可疏瀹而廢與河經藁城自國初至今不知凡幾徙成化壬寅始迫城下淨土寺沒焉自後每秋漲至則泛濫於縣三五十里市野皇皇無所遁棲適有天幸未為汙沼𢎞治六年太守張君淑始開新河於郡南費以萬計未再逾夏水大入復趨故道功竟不成老氓相傳云是河不宜修築惟祭則可蓋神明之也於乎禮諸侯得祭其境內山川則祭典固不可闕然禦災捍患以寧邦家為民父母者職也往者宣房之塞近時張秋之築具在疏理之功亦豈可少哉顧得其要與否耳誠使善工相髙下量順逆遲以嵗月鑿山開源廣拓水境要其上流而放之寧棄百里之地以全城池則雖鎖龍門析伊闕尚可為也而此獨難哉不然為石隄以捍之亦再嵗之利也又其上者平政惠民薄聚斂省刑罰尊老慈幼修祭祀順天時使五行各得其所則火炎上水潤下百川用寧無墊溺之苦雖古昔賢者之論豈能外乎是哉若復迂之於是洪範可遂廢而天下之害付之末如何矣智者試反而思之萬一得其效豈以某之言為迂生之談哉宜安城記宜安漢舊縣也漢以前為趙地考之史記李牧拔宜安走秦將桓齮者是也括地志云在藁城縣西南二十五里今其地有宜安社宜安村故知此地為舊趾無疑但其城化為陂陀桑田不可復識矣於乎春秋戰國之世燕趙之郊正當用兵之衝生民塗炭旦不謀夕天下雖有聖賢不在王者之位故亷藺李趙保障攻守於國最為有功今雖千百載父老猶往往指阜曰此牧冢指丘曰此亷將軍臺是否雖未可知然功德在人沒世不忘之意此亦可以觀矣重修陽和樓記真定為京師輔郡當南北襟喉之衝諸方文軌道必由郡而入我國家重熙纍洽化導百餘年禮樂名物大復先王之舊非復元季喪亂之日故雖池臺樓榭茍可以為民表者亦皆巍然煥然若今陽和樓是也陽和舊傳為郡子城南門以今揆之適當城之中負坎嚮離地局平正市㕓井陌環列四周上置五更漏刻有星人司焉以候晨夜蓋古者登靈臺望雲物占象考瑞以授人時其制度之大焉而不可闕者也今太守南昌熊公既下車之明年興滯補敝百物薦舉乃暇日登斯樓而望之東瞻青徐西瞰關塞而其南則見滹沱迅流帶以清漳千里達于大河韓來魏趨秦驅蜀走復有重譯而至者西南之人卓乎偉哉此非一郡之勝圖實四方之竒觀也于是慨然有風雨鳥鼠之憂焉乃遍召郡民之有秩者播告於庭諭以大法俾葺而新之令既下諸執事奉以奔走資者資粟者粟舁石於山升木於淵羣工庶黎各獻其力蓋經始於𢎞治己未之三月不十旬而功告成矣君子曰何其不煩哉使之以其道故也於乎天下之事固莫不有興有廢然其興也亦未始不由豪傑亷靜之士以道使之故嶽之嶽陽得宗諒而益彰黃之竹樓至今誦𤣥之者未巳茍非其人焉則功立而讟興事成而名隳雖十倍兹樓猶將無取也哉猶將無取也哉大陸澤記珤嘗浮清源道出寧晉問渡於所謂葫蘆河者平波曼衍一碧萬頃茭蒲菱藕魚鮭之利民咸取之供賦稅焉俗謂之水五社蓋五社之民沮洳弗田力胥此出故也噫嘻此其古所謂大陸之藪與禹貢大陸既作是也顧古之大陸地當不止於此今近澤藪縣之田疑皆禹平水土後民始耕作至於今也至觀班氏所謂逾洚水至大陸布為九河則亦臆揣之論今大陸與大河絶不通顧其地相邇不出三百里有此附㑹耳不然豈古今陵谷之推移刷蕩盡失其舊歟趙武靈王曰吾國東有河薄落之水亦謂此漢時其地猶有薄落亭今云葫蘆河者或其聲之訛轉云傳張嶽州傳張舉字孟賢真定欒城人家世以農為業至舉始讀書即刻志鑽仰治書經師事學官講求唐虞三代之學迥絶流類既聞京師多名公碩儒乃裹糧負書徒走至都下復從京口楊舍人一清問道德性命之說侍立終日未嘗倦倚諸儒咸異之客甚窶日提一油􅎆詣館宿乘間請問辨難古今舍人惕然曰士未有如此篤信者也成化丁未擢進士授戶部主事初監京城明治坊諸草場及巡象馬牛羊等房即剔刔姦蠧悉論如法賄賂不得行吏卒大畏是時倉場委貂璫督收囊槖諸詭使部官不欲問則于是之日委順致禮或供張設樂以娛之遂往往掣肘結舌法由是日弊至舉獨不受一茶自擕菜果裁度饑渴雖所乘馬亦清鞚終日不與少秣歲以為常內外憚之無敢犯法者聲稱赫然後監宣武諸門稅日往稽閲出其不意諸課始入公家門官患之請于大司徒教下執不從乃泣訴於司禮司禮曰主事為誰對曰張舉曰是弔馬張乎此賢汝可慎避之耳復督天津運軍採秋青草往時承劄者通州或一至天津取具文牒而已舉身自督率復亷知運官姦弊隳廢冒廩及都運總兵故縱不問諸事上疏論列請置于法不報然上下皆稱其鯁直清果考功課其績曰處錢穀之司著執法之譽考上上論者以為當大司徒鄆城似公太原周公咸器重之華容劉公尤嘆賞不已㑹嶽州如府缺公遂力薦於朝求得為守且語冢宰屠公曰吾嶽人也而舉又吾屬也吾為嶽謀無如吾屬賢者嶽之民其有瘳乎舉到郡案行屬邑考能激汚首罷民所不便十餘事衆心翕然然適已怙勢者稍稍弗悅頗騰口語舉不為變郡前湖水多魚故事守以下有之至是未嘗舉網歲辦鮓貢裁取足用有餘悉付漁戶為課家貧親且老俸資悉以供養妻子未嘗衣紈綺食重肉嶽既多川澤之利上下徴求前守疲於應給至舉無敢干以私者然天姿挺直不能依違詭隨數與監司及使者因事爭曲直詞色凌厲上官積不能平亦屢詘辱之輒憤嘆曰張舉亦男子也何至為富貴下人哉即移書欲求去未果㑹御史復出行部意望舉乘怒有所箠撻主簿一人譴死舉仰天曰以吾忤物之故乃不能芘其屬哉方草劾欲上求竟其事不勝憤投筆而卒僚寀為治喪具檢其篋惟俸錢數兩及衣衾而已闔郡無不悲悼湖中重臣哀其貧命使護喪歸葬欒城及劉公被召為大司馬道出真定親詣墓為文以祭之歎息灑淚而去有子五人太史氏曰李克有言窮視其所不為貧視其所不取吾觀孟賢平生與士信臨財廉處公如家確然自斷不為物撓可謂直諒狷介之士矣及至秩晉専城澤流庶姓直道見擠百挫逾厲竟致憤鬱而死悲夫衛太守傳衛瑛字某平陽洪洞人也擢鄉進士釋褐真定通判平易循雅事無専成人未之竒也兩遷至開封知府鋭意修政務在全安小民使得其所開封為東南要衝且在省下賔客車從輻集百事填委瑛既視事一切不急之費蠲省十五六民咸便之撫按官或有所下令度不可常行即入具白狀從容陳說故上司初以為戅直久始諒其忠信不妄也當是時天下郡縣爭為媚讇所在張金鼓飾輿馬伏謁道旁唯諾必謹得不呵責頓首幸甚百姓利病率不為陳甚至匿水旱不以聞惟恐失名譽其苞苴暮夜益潰濫不可言瑛獨以平正自持直而不挺謹災告窮用紓民力或有所忤謫譴時至輒徐然曰吾凡以惠人為本耳寧恤其他乎由是上下咸稱其賢治行為天下最然終以無援竟不得遷居開封九年以河南參政致仕瑛在官不以妻子自隨歲所支俸錢皆付庫吏掌籍衣服車馬非敝不更造至今汴民猶謳思之太史氏曰臣珤伏讀大誥洎律令諸書凡貪吏皆至大辟家屬被徙埀統建法之意良深且逺哉自後禁令少弛吏爭為侵漁竭澤咋枯上下恬不為怪且相率稱能賂章於朝淫刑肆毒下民益困繇是能吏出而廉吏廢矣國朝亷吏軒輗之後有楊繼宗其後有布政使張黼河南按察副使劉俊嶽州知州張舉與瑛僅數人云清修苦節非人情所甘宜鮮得哉或猶誣為小德是助桀也已余太守傳余瓚字宗鎮京都人也舉進士為戶部主事員外郎擢真定知府政尚嚴明洞見吏事刓敝毅然振作議均徭法定為九則上出庸錢一兩中十之四五下什之一州縣注諸籍歲有所用則稽閲取之民以為便吏有夤緣為姦者輒逮捕以故無敢撓法又奏定馬政條格纎悉備具大約以寬民力不廢公家為指每行州縣必進諸諸生于庭問民間疾苦或時較藝奬進人材士民感悅郡中稱治然性簡伉不能規規下人每候行郡御史裁再拜而已譏毁者多言其耀才他日御史劉某者按真定意欲屈之甫至境上得知府投牒人吏或未發封輒持小過笞辱之因以竦瓚瓚聞之倜儻大笑曰是將嗛我不置瓚獨非夫哉㑹劉御史適留其僚王某者泛舟大陸澤飲宴為樂乃移文論之曰寧晉地瘠民寡比歲旱蝗二公亦各奉命有公事池上之飲淹留彌旬供張之具不無損于民者幸量移一邑時二人方坐㕔事聞有府使至發書相顧大駭王本河東巡鹽御史也即驅傳去劉愈大恨之自是上司益復設疑卒與後至使者柯忠構訐移知黃州府未至道卒瓚美姿神善持論遇事侃侃無所屈真定當西南輻輳戚宦貴人過者公愾之外私饋不行州縣亦倚以為重率放而行之民大省沒後數年西北用兵大司馬馬公每稱其才可任重託㑹閲各郡儲粟惟真定至數萬石視他郡為多復言之朝加封爵云贊曰都下多四方賔客名卿巨人士生其間聞見自博往往有涵渟閎衍之意然五方俗雜侈汰相矜修姱偷媠波委成習故登仕籍者咸不能吏事敗賕觸罔者時有之若余真定之雄才偉識吏道精敏復緣以儒接踵趙張可謂不係于類哉至其睥睨一世寧折不撓則不免漸燕趙之故風與孫僉事傳孫博字約之河間景州人也倜儻有志節通毛詩博極羣籍尤精語孟酣飫沉泆著為論說深得聖賢之指諸儒競傳誦之釋褐為歷城教諭登進士授禮科給事中論事不避强梗聲振瑣闥成化庚子汪直用事立西厰密令左右親校覘察公卿以下官得失輒注考語乘間聞奏有所黜陟或徑自捕繫考鞫內外恐惱里巷細人爭詣厰污􅀈官吏權柄下移謁私門行苞苴者益大起博上疏論直盜弄國柄作福作威使君相廢職漸不可長疏入上令毁西厰直大恨之尋遷山西按察司僉事博既禁闥舊臣又襟韻疏暢居法司鬱鬱不得志㑹當道時欲有所指擲遂乞致仕還鄉里茅茨蕭然未嘗有戚色日役蒼頭課田園或遇故人賔客觴咏不倦凡仕宦至景州者猶時時勞問𢎞治甲子知州馬某貪虐毒民博諌之不懌遂以事侵之博發憤詣京師論其罪惡及人命十餘事得賜詔獄問且遣使者詣景州核實知州度不可解乃佯為謝罪置酒毒死聞者莫不憤嘆初公且死囑其夫人曰吾以孤直不容於朝幸奉先人之業得休息田畝教誨子弟百無所恨今乃為羣小所害命也夫我死勿埋吾尸庶幾朝廷覺悟得為百姓除暴去亂吾且含笑地下矣遂死馬後竟伏誅太史氏曰先子按察晉陽嘗與孫公為寮寀珤兄弟又嘗侍几杖質問九經親見其為人卓犖開爽有古國士之風然慮事不欲為太深又不設城衛故始以此立節中以此去位終以此致死語曰直如弦死道邉信然哉劉按察傳劉俊字君佐真定深州人也舉進士初授青州府推官鞫獄詳允不避盤錯每行部不治裝亦不列騶從衣大布蕭然匹馬如先書生至則趣對雖强梗桀驁無敢不懾伏秋毫無所容私吏庶凜凜大稱廉平尋召為御史風裁益振擢河南按察司僉事遷副使所决獄多人所避難弗任者則揚推曰非劉公莫治君佐亦蹇蹇自負聞事風生無少回屈有罪者度不可行私即首服每分巡大梁河內等道一道肅清歲當代姦吏酌酒相慶是時進士多出補州縣上司禮之視他為優其州縣亦自謂行當被召故往往為急政立聲名或倨肆自如甚者苞苴公行不自重惜俊曰凡州縣皆吾屬也政均以品則可矣若分析太明是使賢者弛其志而不肖者傷于寵政蠧民敝恆必由之故御屬吏一視兼聽惟以法為凖不少寬貸後多去為要路者亦時有怨言然君子亦由是知其知大體其後有劉某者河南人也弗悅俊造為飛語伺科道當劾諸方面官遂注名貪虐以奏詔下公卿議大司徒似公鍾識俊名曰是青州故廉吏劉俊邪頗聞其節愈厲奈何有此事遂寢然性戅直不飾邊幅在官終日閉門不通一謁有善客至時或對飲惟蔬菜湯餅而已必求盡醉指大樽曰吾興在是非浹洽不可奬善疾惡皆越常格率意而行卓詭絶衆以致仕終于家太史氏曰天道不息聖人貴誠季世多僞故直諒敦朴之道不行焉雖迍邅齟齬然理國之具非兹士卒莫可使者既亮其忠復以纖介萋斐不究所藴進賢若渴吾聞其語矣文睹青天文石子葬其親于宜安之南里長號訴空五內崩潰逾十日而疾作血脈憤興貫瞳决眥雲曀萋靉遠不能視禱於神弗應醫藥療之弗克乃支之夜焚香布楮明水載酌自籲于庭於乎造物者乎厥初生吾孰命豫氣曷隂曷陽輦輹衆理丹扄熠耀發謀出智百執環廬神明涖位孰弼其成孰造其始水穀委海音樂歸土浸淫下胞旋􅎵出腐緑囊其綈有力孔武蔥蒨維東曷盛則恐華􅀈既張清風內揚九斿皇皇倐溫忽凉水府孔修木明火章上蒸崑崙溢為瓊漿周流四旁以城中方敷施翕受孰執其綱四體既固膚革充盈聽德惟聰視遠惟明齒剛能决貌端以凝著為議論廣邈鏗訇摛詞綴篇家藏世行移忠以孝貫明於誠上沿姬孔達於始生茫茫華夏服其聲名孰誘其衷俾余有成操思絶俗治思變道學思入聖言思入奧偷溫茍飽糞壤行潦卓犖自存孰啓其好繄天之能作物之則始也何豐後也何嗇內搖其精外奪其色岐扁無功鬼神匪澤於乎噫嘻天其無意于吾乎抑其有意于吾則警戒既至黜罰宜弛復之以環直之以矢還其光華蕩其渣滓朱軒華冕吾將不以為崇緼袍穿履吾將不以為恥吾將沿諸經獵往史訂羣儒搜百氏馳騁上下百千萬䙫治亂臧否形之掌指成一家之言述當代之事優游哉以卒歲茍一息其未已然後奉造物之初錫而歸之可謂成厥終而顧其始也其無意於吾則形固帝形也貌固帝肖也姑以與之還復取之姑以發之還復落之浸假而化余之目以為彈臂以為弧凥以為輹脅以為輿以氣為索以神為駒吾豈不能乘之以往而何苦於拘拘天乎神乎有意無乎胡多豫之不幸而不閔豫之無辜乎告已退位隂風蕭蕭灺燼既銷闔戶言宿俄夢羽衣蹁躚若勑使者自空而下揖而謂豫曰惟汝至性通于神明曰汝無罪則為匿情昔者商退西河尊師未力其道雖隆受天之殛守道如寧行可無悔三晨晏興幾沒於海此皆盛德猶以微纍於汝擢髮可數其罪汝之立朝不聞正君食君之祿而後其親發為文章何補于民祗取聲譽以光縉紳爾在童稚開乾闔坤謂叙九疇謂批逆鱗修之白屋壞之清塵易其國士而為詞人矧為歌詩刻畫鬼神抽黃對白窮涯極津非今是古悲周劇秦鳥駭獸抃山顰谷呻霜雨揮毫風生運斤金貂被嘲將相䝉嗔千鈞可輕枝木可信智勇失慮愚泯忞忞斂衽延譽倒屣迎賔回顧時髦瞪乎後塵天之所以畀汝者謂何國之所以養汝者謂何而汝以文其身乎暨其葬親視禮為粃縱其天性號若孺子踊躃無數血涕沾履朱炎鑠金勞勩不已以干孝名以聳閭里長者來唁汝塗其耳毁瘠既形莫慮終始奉親之枝作疾誰使雖然過有可改德有可沐日月之光虧有可復憂患致存疾疢生福帝令赦汝不汝為戮尚慎思哉無易前覆豫聽其言惕然內訟芒然不知其自失也嗟乎誠豫之多罪哉吾有過吾不知也而人知之人不知也而神知之而以質之神而以折之天誠豫之多罪哉乃載拜受命既能自反使然豫言遂致首肻彤雲倐散漏聲在板起呼墨卿載之竹簡說去思說有斐之章德武公也誰嗣之謠懷子産也召伯去而甘棠勿翦叔子沒而峴首有悲彼數君子者其深仁厚澤誠有以入乎人心既深且久歷百世而不可泯耳故夫老子壯孫相與傳誦不休不惟身被其福口誦其人凡吾所以養老尊賢長長幼幼厚生送死得庶幾于先王之道而不徒為人者何莫非上之賜哉德其賜不可見其人矣于是或睹其興作建樹之功或經其遊歌燕集之地傍徨悵惘無所宣泄乃從而吟咏之又甚而碑碣之又甚而悲號躑躅之耳豈惟數君子者不知得此于民雖民亦不自知其思之至此也是故王者之風後世猶可想見其萬一近世則不然好名之心勝而希古之願深不力其本而惟末之是飾裁一舉事輒欲勒之鼎彝埀之萬世又其弊也狙畜其民而奪其利剝割斬斷以籍民口恐上之人一旦之見謫也又乞哀以餂之計無所用乃復風厲士民為之立石頌德欲以欺天下噫嘻何其不智之甚哉夫善善惡惡人心至公雖以智籠之可欺于旦夕尚不可欺于永久况夫顯惡著慝昭昭在人可以一手掩衆目哉縱人可掩已心獨可欺哉古人有言一自誣者危再自誣者病三自誣者滅吾恐逆天違人自誣以取利利之未得而害固將至也或曰君此者雖自誣然亦知慕善名掩罪包羞以跡古人不猶愈於尋常乎嗚呼此說之行是使道之益不明也聖人惡巧言令色孔壬惡鄉原之亂德正為是耳夫人品髙下自差殊不同茍盡吾材與吾心雖無德澤以及於民亦何愧哉縱使有好貨財肆刑罰以利其家所謂尋常不足道者然亦終日惴惴恐蹈法網不旋踵而譴黜重至身被惡名終身不敢啓口言及聖賢君子事彼誠識之淺小以至於是而本心固未嘗盡亡也特私欲牿之而已豈與夫盜民之利盜國之柄又盜夫古今天下之賢名者同哉天下不皆聖人亦不皆賢人君子茍不盡亡其本心雖材之庸劣聖人固不深絶而賊盜之人孔孟力拒之今乃不能為君子又不欲為尋常而顧乃欲為穿窬大盜何哉嗚呼吾不能得使天下皆君子亦不能得使天下皆不為尋常必不得已君子什之三四可也尋常者雖多無害也狙巧盜名之人有一不可也媒說西里之婦有習為媒者三年不成凡為絲蘿之好鮮扣其門釡竈蕭索將營他技聞國有大媒氏乃載束帛往問之再拜而進曰自婦之為媒也膏唇錯齒毁方削亷意隨波流辨逐風生化媸為妍扛卑使尊堅白同異燦爛紛綸盼移喜怒咳定取豫左顧漢勝右麾齊衄自以為術已精矣一行而節應再舉而轍亂久益齟齬行唾於塗立詈於垣不敢出戶庭者歷寒暑矣將逃之他郊無復言媒妁事竊聞大媒氏旁通於道大化於藝願進之階下以袪愚婦之惑大媒氏呼而起肅而入布席於堂斂神凝思屏左右人三引其端里媒不悟乃閉之別室致憤發悱明日又問之對曰將無夸毗失繁吸訾失幾功急大勞反損事圖速成反敗與曰未也趣復入戶三日然後召焉則見里媒之眉間栩栩然有動意曰幾矣得之矣問曰女知吾媒有大權變乎曰然吾為女言之天下之道有經有權聖人用之智者效焉先王之道至大極遠吾儕巾櫛賤婦委巷小人安敢議之雖然御有百車不如詭驅兵有百萬不如反間是故我遇其常揚兵正旗三戰而勝功非我誰卒遇勍敵我計不展進與無所得退與有後患彼乃嚴兵以待我亂我乃騰飛語飾謗書賂左右私名姝嫁怨賈禍以保我軀是以亞父抑田單走樂毅奔朝錯刮忠反遇禍正反䝉詬必如是然後兵可制勳可就矣媒有兵道焉女之所習者蓋勤盟屢講朝平暮成蓐食而更戰既陳而後擊之法與故口血未乾而盟已解圍柵未備而敵大至矣女所謂知媒之常而不知媒之變者乎吾為媒三十年矣被選入官亦復十年吾譽枯楊使為春華吾毁白台使為嫫母吾言一出彼各心醉彼執一端我當其㑹收兩家之歡得三倍之惠卒有乖忤吾委諸其鄰其鄰不受吾委諸其親其親不受委諸他人彼自交惡而吾潔其身今吾老矣國中推善為媒者無以逾我而老婦壯子少孫行女感我者亦多矣雖然其難易之理成敗之數爾亦宜知貞女易成冶女難成妍女易成醜女難成禮法家易成失節婦難成蓋其媺惡素定風聲素遠幸我輩者雌黃炫亂黑白顛倒使芍藥之艷得儕行露而升者以有此舌與齒耳故吾輩者為正人小利為邪人大利而怨不及焉抑吾聞之嫁怨於人其怨將繁賈禍自我其禍始大吾恐明王之世終無稅駕之所姑以卒歲利吾身而已乃更教女為之吾不仁吾不仁於戲大媒氏固不足取然其言時合於道特擇術之不精糊口之欲亟以至此耳以吾觀今之仕者何止一大媒氏哉而顧偃然自以為得計亦甚矣熊峯集卷五
