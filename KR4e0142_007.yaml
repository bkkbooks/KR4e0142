body:
  text: 熊峰集卷七明石珤撰詩四言古述始於皇崇祖植義稿郊板蕩越疆神鳥寓巢回翔故都革緇正綃增墉廣田以培以條維伯仲季載富載有載碩載阜以貽我後曾祖皇皇震器是將既經我畝益樹其桑肇造文業聿興義方冠裳肆好俾遊于庠我祖孔達閟鋭見末爰抱三傳如飢如渴有髮斯總才莫我越羣師相雄一鼓而奪莫顯匪文莫大匪倫臨晉于鐸文敷行惇諸生循循五經紛綸士習有立凮流于民攝行宰政以教為令蠢彼細氓往蹈于阱乃搜乃羅覆謂我縱韶陽之謫湖利是正人皆戚戚往覘公色奚遠而欣有道是式維出與處如語如默橫流度江宅于炎國黽勉陳力奉天應時庚桑能化桞下不卑瘴雨為沴耻賦式微夭壽曷二我願則違烈烈祖妣豫章出徐義正掩衾澤存束書勇不難死乖道乃虗瀝血褓嬰北懷敝廬江水瀰瀰鳬鷺蕩止我心有傷曷惟其已長鯨巨龍有戟其齒志存趙孤即隕無悔維帝相忠載徒載航大節既完遺骸亦藏烈日明明有嚴其霜我公克念實嗣其芳家造孔艱一得百喪脫簮授經以泣為杖大科既捷繡鉞斯抗貞節顯褒允也非妄曷統匪垂曷則匪作我公昌之有穰其穫正色莪聲衆枉錯愕松柏之姿振而不落人咎公直公曰我平安能低卬以趨衆稱人咎公方公曰我正毁亷刓隅實拂乃性王事靡盬載馳載驅中饋允吉內言不踰肆我恭人實勞實劬匪機匪刀爰字我雛維兹伯氏克踵前武抗顔在廷亦既有斧我德則涼遊藝之圃職雖論思衮闕曷補公曰爾兄暨爾諸弟爾讓爾友是為鍚類我有清白以為汝遺我有不欺俾汝不匱翼翼其庭有訓匪邈載瞻載仰四世伊託周源孔津公教所泊我小其浮靦焉有忤巖巖丘山公戒肖之凛凛淵氷我實蹈之濳德未揚慘莫道之悠悠蒼天莫鑒我思遠遊君之出矣遊如之何朝覽冀野夜浮滹沱帝子不逢中流揚歌高鳥墮雲遊鱗遡波曷發崑崙曷濯洧盤禾黍蔽野童欣耄歡新聲在梁清酒在尊聊以永日以抒憂煩謝桑園子送山丹有灼其華緑莖丹葩我思古人德容孔嘉南有赤烏其聲安安我思古人為家孔艱朱鴻翩翩載宿于渚亦有駵馬服我車下維葵維藿可以療飢維山之英與子樂之五言古芹香别思代郝立夫作泠泠堂中琴肅肅階下羽藹藹來冠襟森森日鼓舞及時惟春風萬物待朝雨射師示正鵠學者識規矩誰悲鄭虔飯自誨宣尼脯白髮顔可怡青天色不憮朝遊仁義淵日夕宿藝圃清風起芹末幽芬在庭户至樂紛兼三達道亦由五寸心良不欺持此報君父詎謂臣之忠必待分圭組婺緯知憂國叟黂知獻主况兹擁臯比何翅什與伍亦有待問鍾不獨攻堅斧行聞棟榱篇餘韻更縷縷雜詩二首雪霰紛漉漉忽然見朝暾氷霜墜盈地中有青苔䀶幡幡鳴春鳥解使朝變昏果哉烏鴉白不謂黃河渾小雅歌緡蠻陳王悲豆根此曲勿復竟子蘭方在門其二鷃籬無高鳥牛涔無巨鱗物大會有合淺小安足陳藤蘿附松柏繳繞固其真桃李雖不言吐華自陽春齊魯事口舌秦人如鬼神末路多此比龍蛇貴存身五月大雨仲夏月幾望藴隆何爞爞洪罏鼓元氣烈火燔層空陰谷絶爽籟齊紈纍無功鳥疑焚其巢翼榻飛不翀東方有雲蓋裊裊來天中崩騰蹴萬騎閃爍張雕弓雷電動俄頃滂沱灌羣叢不有明神力蛟龍詎能通憶昔漢中造此日生髯公昭烈帝子胄桓侯萬夫雄翺翔歷郡國意氣驅羆熊走馬萬衆間斬將如發蒙刮骨不動顔志存安有躬炎燼再吹噓白日諒精忠至今百世下栗烈增嚴風威靈行九天霈澤垂無窮三驅獲魍魎一怒號豐隆豈感懸弧辰伐鼓聲􅣨􅣨憑軒良悚然仰看氣成虹真意堂詩大道流宇內羣形各含醇紛紜千萬端率性固其真高鳥凌風翔遊魚翕其鱗天淵茍易置拂鬱詎能伸卓哉孤貞士築室西江濵盼菊以怡顔意與鳶魚均兀傲踈籬下不知纍重茵赤芾稱峩冠物假吾之身勃然見真吾此樂難具陳真意良在兹高吟謝市塵擬古秋懷弱齡希仲尼無位非所患寧知歲月駛白日旦復旦才逢春英隕更睹秋河爛溫涼轉世象吐吸步仙算雖非北海豪却比東山慢緬懷千古人落葉視微宦忠肝奪霜明雅志戒物玩色潤貞觀業筆轉奉天亂縱無浴日功夙夜不停翰仰山益慚高涉途恐廢半願馳騏驎足不負孫陽歎九月不見菊九月不見菊兹襟若為開深巷有酒家喜聞潑新醅朝回往叩關酤取三二杯當軒斟酌之况復臨髙臺雖無露英掇西風亦時來百慮忽已祛聊復優遊哉緬思靖節言無絃未宜猜天真會有得魚鳥自徘徊感此坐已忘兼欲停尊罍浩歌星月前餘興良崔嵬偶書青晨罷盥潄紅日已篩影東風雖應律尚逼重裘冷徙倚餐朝霞用意貴精猛乃知塵紛中萬動輸一靜食君數石祿疏散亦已幸覽此床頭書千古得馳騁所嗟志難持人事亦易屏或恐被嗤責此去當笑領元夜山林有夙約駕言至東門倦鳥翼斯斂回翔正翩翻呼貌上市頭所買燈亦繁并剪鏤紅雪照夜光輝存濁醪三兩觥百念胸次屯望月憶親顔素餐怍君恩出身逾十年尺寸無足論長恐秋霜生壯志託空言請謝門前轍深居涵性源中秋對月華月出東海萬國同中秋氷輪轉碧落風露聲蕭颼坐數寒桂枝扶踈應九州老兔毛欲脫杵舊不足謀瓊瑶十二重空鎖嫦娥愁天道日左旋長河亦東流人生望朱顔靈藥安可求不如天津橋幸遇董糟丘一笑萬事失黃髮升瀛洲寒泉濯足翩翩黃髮翁濯足巖下水吾志在清波世事如脫屣青山長悠悠白石亦齒齒千古孺子歌誰能契斯理南薰午夢寄傲北窗下無思日蘧蘧前林交遠隂薰風入吾廬羲皇千載上夢或與之俱寤言盼庭雲對之時卷舒猛虎行南山有猛虎聲勢何咆哮野豕食殆盡無論鹿與麅山徑行人稀田事苦莫拋叩鉏下危岡秉火仍喧呶誓將棄此業往適彼樂郊丘中有遺髑哀哀婦人哭黃雀小小黃雀羣鮮鮮刷毛羽躍躍笑飛鵬啾啾學鸚鵡雀來吾語爾爾德焉比數乾鵲能知風商羊亦知雨雎鳩知定匹慈烏知返乳爾既無可稱喧囂競為伍竊榖不厭多趨炎赴堂宇天下羽族中吾於爾何取去去遠吾廬莫待我鳴鼓勵志日暮飄風發掩身固重關深居擁裘褐一榻危如山榾柮奮殘燼稍亦能祛頑炎涼固人情道在意自間呼童命濁酒一飲便酡顔顔酡不足羡豪氣時往還仲尼道高美可望不可攀學聖聖之徒不學髮斯斑若射就由基若木就輸般致志在躬行能言固非艱烏獲未謂強匹雛詎云孱不見鄒國人浩然塞兩間春日郊行驅馬薄言邁悠悠歷阡陌桃花照人紅桞絮隨意白舊巢飛燕入髙樹鳴鳥擇水流金勒駒草藉青油軛舞蝶下新粧落梅點宫額那堪繁盛時猶作羈旅客彈劒發燕歌木葉驚摵摵太息日月流何翅驥過隙貴家磊珍寶萬金起高宅心雄百代人身作九州伯撞鐘集舞女建斾列畫戟盛運一朝變蕩滅無遺迹乃知身後先貴賤未可逆幸對一尊酒春意何其適放浪脫形骸談諧鈎隱賾不知秋菊英安問歲寒柏錦綺賦百篇金聲試一擲不負春日陽草樹俱澤澤悼亡驟驥下長坂日月雙轉轂容華易消歇奈此光景速結髮與君歡繡簾映華屋芙蓉為君面秋水為君目佩君宜男草飯君落英菊誰知綽約姿棄置在山谷凄風偃蔓草猶疑靡羅縠皎月射危坡哀烏號古木安知下泉人不念我幽獨君無兒與女誰為君斬服白楊漸有芽二月酒初熟荒涼隧道外徒使奔童僕紙錢燒作灰素手豈堪掬拋殽在中野秪充飢鳶腹回風從西南裊裊如紡軸未知是芳魂瞻望令頞顣伉儷雖人合乃亦繫骨肉顧彼雙飛鳥安能不反復語盡情未舒聊以歌代哭碌碌何足道為學二十年聞善思允蹈四歲知詩書八歲勤灑掃十三為文章光澤春雨膏十九學漸富士林有稱號瀛洲名濫入君親思未報高步望登堂爝火求就燥逮今又十載不覺壯夫到彬彬猶未能碌碌何足道病驥吟良驥本龍子病來失風雲北風振長鬛猶念萬里勤朝飲長城窟日夕秣崑崙意氣輕百戰功成大將軍漢家麒麟閣丹青貌殊勳騄駬棄道傍哀鳴人不聞四蹄空踣鐵五花不能分平生感一顧何以報明君述志五采莫如白數動莫如息貴名幾喪身嗜利竟死食首陽垂令芳憔悴亦云極矧兹末路塵鉤曲亂弦直胡為佩芝蘭役意強修飾吾聞上古人無為日玄默避名若深淵安辨淑與慝駕言往從之相忘於道德夏日二首夏日本多暑百思併豫嬰呼童灑廷內几閣稍凄清燕子自來往雞孫亦生成深林來客踈古甃有苔明薰風何拂拂朱絲非我聲其二夙昔念遠遊抱痾願多爽坐觀流景速池霽緑初長庭樹漸鳴蟬蓽門日恆敞溽暑苦中人棲雲猶漭漾安能吹清角暫與豁幽賞漫書炎炎積暑意耿耿抱深懷雲含雨遲落鳥呼風不來疏林滯清響幽客卧髙齋暄涼雖殊態謀道詎云乖獨披牀頭書如與古人偕曠思倐無極焉能顧塵埃園中董子下帷日三年不窺園而我希躅人胡為出屢繁遠風噓病骨百念跬步存新燕雖好音不能盡欲言回首告稚子夕陰已盈門夏日憶京師雲意夕已集晨初鳴雨繁烏情急繞樹蝶拍亦翩翻芳圃緑逾靚藕花紅不言憶在京都日屢尋山水源妍景宛相似朋侶亦俱存所殊多病及猶掩去年門沾巾雜簷溜聞笛銷旅魂忽恐秋霜落沉憂感鬢根漫書古體僻性鮮諧合樂聞長者言忽從黃綺遊曳履過東園徜徉意自適杯飲禮不繁下論暨秦漢上談遡羲軒麋鹿卧我側羣猱戲相援睹物契至理歸求吾所存對雨午窗山鳥來乍起倦無力遊颷素帷翻急雨銀箭直初添地氣爽倐作簷甍黑炎氣驟失勢庭樹或改色我雖非農夫情亦欣稼穡養氣徒浩然抱痾苦逼側所幸風雨時得收黍與稷嘯歌濁酒前可以寫胸臆夜坐微月倐已出明星裁數箇露來花上繁雲到窗間破誰家擊鼓聲忽有驚烏過暑中暑氣連日惡坐甑有此語庭除日已滿况復少茂樹清風呼不來灑汗欲成雨喘熬但狂奔棲鳥亦刷羽寒思氷在咽渴望露澆腑誰能起秦青髙歌木葉舞暫與豁塵煩坐我澄江滸立秋造化妙生息貞元互為機坐見夏木林忽有秋葉飛新涼化炎歊此意亦已微誰令西南風颼颼度窗扉窮士悲物變哲人貴知幾仰觀斗柄移歎息聲未希古詩器微滿乃溢才備德不形大功有神軸至平惟水停不見唐虞日垂衣臨廣庭運動物不覺端居天下寧作誓民始畔勤盟血徒腥何况衄敗餘繼之以幽囹古道不可復誇詡類俳伶藐視三皇業嘒嘒如小星自謂臯契出不希麟鳳靈俯視秦漢士牛涔間鯤溟大言久不怍吾歌安足聆余既病目逾年竊自痛悼乃憶古之賢士亦屢抱痾漫作病士諸詠雖與靖節詞旨不同質之原思亦復慚負讀者體其情耳子輿本達士曲僂當盛年輔車下參脅會撮髙指天隂陽氣有沴中心良獨間日勤平生唁鑑井方便􅓷造物等傳馹乘之隨化遷俯安支離形言笑恆晏然漢廷論遺直無如汲長孺靣數平津姦庸知武安怒將軍感長揖君王為冠屨賜告禮已勤拾遺志猶固矯矯社稷臣淮陽迫遲暮千年仰餘風理欲為君悟上林多奇獸萬乘愛手格耀武誰揄揚臨卭有詞客駟馬志何壯千金價非索渴卧歸茂陵文君亦頭白負弩夸先驅琴心貽內熱爵祿雖未充聲華固軒赫魯人固多兀不獨叔山子亦有申屠嘉談精略相似操幾耽至言遺形契真理肝膽或楚越何况顱與趾能感髙蓋朋視之若脫屣咻笑雖塞塗方遊太虛始漫書二首化機流宇內浩蕩春如波性命豈吾有隂陽惟委和至人率真意俗士較寡多天功為已力百感形泣歌欲識榮衰理請盼庭前柯其二騏驎日千里捕鼠愧貍狌魯雞伏鵠卵越雞良不能小大固物理鷦鷯等鵾鵬得造境自適入真化可乘何必朱門戟可以易樞繩中山酒中山有旨酒自昔聞其名倦客驅羸驂主人有佳情呼童具一斗酬唱多巨觥耳熟增逸韻慷慨道衷誠憶當玄石飲三年然後醒形化託丘壠妻子泣嚶嚶西來剖棺斂相勞若平生驚倒里中父行人佇屏營豈有大聖藥能斂神氣精豈有駐顏飯如彼瑶瓊瑛束縳不能害泉扄若通明嗟彼野史言荒誕安足評病言多病欲無言凄風感心曲十年侍明光羣書校天祿冠佩含春風翺翔總鸞鵠素飽愧未湔拾遺夢空觸豈期揮翰手欲展扶黎足竹簡經蠧穿胸襟被塵梏雖云日偃仰亦復成局促非不思古人知榮守其辱雅志良難酬歎息聲相屬慈烏吟啞啞城頭烏朝日帶寒輝銜蟲哺其子直下草野飛天寒老雌獨日暮望雛歸啄粟至已晚長恐摧羽衣下有倚閭母歎息聲未希遊子在天涯四牡恆騑騑有所思蘭臯步余馬騁望登白薠美人隔江渚夙昔相定言遠道不可見深思歷寒暄世運如轉轂秋霜變春顔出言雖有章佩服多蘭蓀妍醜懼相形心肺日翩翻翩翻詎有極君子貴容德冬至感舊兀兀坐虛簷兹晨日長至念隨供奉班風雲動高思鳴環待宫漏擁笏趨嚴地謹身殿初啓聖人在髙位倣徨日月側親睹天顔喜三號聽雞人四表瞻光被遠方致琛賮車馬陳廷內豈徒列炬輝賸有鸞聲噦聮袂歸鳳池歌詩亦鳴治那知風雨惡抱憂忽逾歲巖穴隔重華秋鴻但垂翅起窺一陽生臨軒墜雙淚感興三首世路險且迫氷雪滯行輪歲暮安適歸西方有佳人采薇食芝實聖主不得臣誓欲往求之為敘纍世親凄風吹我衣龍劍欲張鱗豺虎鳴道旁君子有未仁悵望不可見慨歎而傷神其二至清則無魚至察則無徒山藪貴藏疾大川恆納汙仲舉見已晚元禮隕其軀疾甚乃主亂反以瑕敗瑜嘉木未易茂荆棘可勝誅所以明哲士但在守德隅周詩歌玁狁薄伐不窮驅其三鳳凰翔千仞鴟梟嗜腐鼠卑高各異性戈長不舂黍至人等彭殤鳥獸可同處君子慎辨物擇身貴得所寧為昻昻駒不作鷗與鳬銛創雖易缺白璧終難汚棄置勿復談祝鮀言孔甘春日春鳥鳴漸和遊絲倐輕揚寒蕪吐新碧冉冉階砌上憶昔初結交所遇多倜儻孔楊謬見數沈鮑惟堅讓含葩當盛日發耀亦炳烺朝吟昆明池暮集金門仗氣徑志靡奪歌悲節逾壯那知日月速朱顔易凋喪緑髮日以踈歡娛成惻愴感此花木辰澘然泣相向夜坐同兄明月出東方蟲聲初在戶宿靄倐已收庭階出芳杜流雲翻細波坐對喜欲舞秋色何悠揚龍泉碧花古緼袍良非貧所貴在清素况值宵旰勤側席思口苦紅日關寸心移孝固其所豸角飬既成山龍門應補乃知南阮心不以萬金富燕將雛飛飛梁間燕可憐日將雛雄雌更出入羣兒恣喧呼城南蟲蟻少苔花濟餘餔皇皇往求之似畏西日徂豈復惜舞翅譙譙大勞劬聲音覺漸長羽翼齊已無會須見返哺詎後庭中烏夢西湖山靈有宿約寤寐應未爽高韻擺塵俗幽思入無象分明桃花潭春水增十丈遲回虎穴傍展轉不可上平生志多違萬事一悵惘出門見明月悠悠興深往書秋炎駕煽中宇海沸魚龍頳梧井葉倐墜錚然簷騎鳴白露晃丹葉明河瀉長楹坐見螢火流涼思驟能生平生不習暑况兹多病嬰濯手理黃卷前除凄以清微颸度修竹木杪下秋聲不待張朱弦兩耳已開明俯拾青莓苔宿靄自盈盈移枕頽簷下簮紱欲忘情送邵國賢分韻得引字君帆已南下僕念日旋軫豈謂萍水分如失繩與凖平生東朝歡肝膽屢得盡曠然趨大塗一笑破畦畛器巨用不微多士宜汲引誰撞待問鐘虛往歸必稇吾聞凌霜幹乃自階下筍願培正直姿出身濟時閔雜詩二首世路多窘迫曠然同衆趨發步未成矩榛棘已盈塗行人笑蹩躠自顧益躊躇暫得美蔭息似欲忘其軀豈敢厭紛濁頗能遂踈愚乃知佩明月不如服草珠雖有萬金鼎所安在陶盂至德貴愔翳皂白始興誅珍重廣成訣靜看雞與鳬其二皎月邈中天清光照無極秋毫森可數萬里經一拭寧知黑水潭其下深莫測龍蛇方蚴蟉白日鬼爭食居人自凛凛行者為惻惻乾坤有遺憾周孔不盈德安取混沌爐萬象鎔一色臯禽不知素城烏不知黑大化康衢人不知復不識雜詩二首辛俞從欒子寧畏大戮施欒布事梁王冒險猶陳詞古人守節義豈在崇與庳意定蹈湯火志明羞詭隨寧為白璧碎不作脂與韋寧為鈍劔折不作鈎與錐彼視富且貴草芥奚足為正氣日淪喪功名始多岐射利等趨市亷耻棄如遺雖有首陽薇莫療夷齊飢荆卿與灌夫末路未可嗤其二節鉞不期傲金珠恆自豐物交中乃移至詘豪與雄疇能讓田畔斫榱竟不礱訾祏雅端博張老仁且忠不有賢哲言主名安取隆所以公與卿下士貴從容諤諤有深惠唯諾禍所鍾勿怙圭組貴軒鶴笑寒鴻茍移造物柄簣土亦易崇高臺置郭隗蒲輪起申公此道久不作紛紛喑與聾對雲庭除若逼仄况乏林與溪浩志罔所投日長對雲霓岌嶪聳千仞奔騰散羣麑暫逐健鶻上遄同歸騖西取物良不窮入真相與携更思窺玄窟待月升華題秋日秋日晴自好遠空明鴈書雲淨碧峯出棨戟列吾廬墜葉填古井積潦自成渠雖當搖落辰壯志尚有餘真欲乘長風浩蕩遊六虛倘遇廣成子試與談太初蛾眉山驅馬歷長阪溪流縈且回俯聽寒泉聲斷岸亦崔嵬星斗耿深光古道各徘徊雞鳴喜達曙努力進虺隤晴旭挂林杪巖隂倐然開始見蛾眉山蒼翠出灰堆主人綰銀魚勞問列尊罍探奇試潄石懷古復登臺感彼郭與樂疇昔萬金才功業那可見英爽久沉埋悠悠百代下松柏等蒿萊乘時登雲霄失運墮塵埃雲霄與塵埃畢竟安在哉不如飲美酒笑傲破羣猜南溪雨歸南溪豈不佳碧沚漾輕舸柔絃日凄清花樹何妸娜境勝簮易集適到意多可苦為急雨催未得長坐我倉皇出籬落萬弩縱銀笴飛鞚捷澗猱復惴道相左冠裳信滂沱蓑笠悔失荷望中岡與陵所遇乃坎坷振策行復呼飢僮踣而跛潨流橫奔壑角觸浪交瑳疾雷躍我前避電驚蹈火平生嗜臨眺有約屢未果奚為奉遺軀小視類蜾螺玩物幾喪真懷土信多禍下馬結沉思從兹戒遊惰偶書浮梗已汗漫託棲仍未寧身外雖無餘舉目亦充庭十口可誰捐敝笥滿六經紛綸繫手澤不獨遺氈青踈琴載餘響瘦鶴驅伶俜轉徙諒非難肩轂恆未停物貴心反役豈為善存靈細詠卜居篇永服陋室銘憶遊南溪雅積山水懷自非簮纓質屢辱知者招頗袪愚蒙疾南風初滌暑出日自逢吉峯巒千里秀禾黍望時實始泛南溪舟兼鼓瓠巴瑟中流躍文鯉萍藻亦何密茂樹鳴時禽雄雌若相失地勝詎因人吾遊幸終日清醖坐銷憂浩談忘促膝明珠公勿靳此有鮫人室養生答張進之殉名思馬革殉利同即蛆智僅脫虎口忠能葬江魚前躓後愈憤衆毁吾獨譽勞神役百感所得惟髙車一念忽超脫萬事皆成虛行止但無心亦如雲卷舒放浪廣莫境優遊心遠廬黑白非所計且願復其初紀夢夙昔夢飛騰中年羽翼短有時暫凌霄意願每不滿內省知志衰前行任塗坦如何今宵夢復似奇與誕偉然登廟堂受詔亦不緩還提三尺法往雪九秋旱所恨事未竟遊刃中肯窽一回幽谷春更為塵國浣雖非無夢徒猶勝但酣懶秋郊湖山縈宿襟危眺偶一豁葉脫峭峰見煙霽平野闊下馬遵石堤廢碣蘚可掇昔人來歌地歷歷增慘怛事去朝露空安辨窮與達吾儕際清朝復此謝轇轕嵐光舞宮寵凮物療文渴坐對古今變萬類等毫末猶思勤鍾鼎一繼伊與葛夜寒永夜寒氣生屋低仍積草引燭爇乍紅和燠徹肌表擁衾坐稍安萬事塞幽抱城漏何淙淙東南有鳴鳥起窺寶劒光報恩人未老曉寒樹杪煙籠䓤棲鴉噤無語寒日上更遲茅簷試延佇豈無濁酒觥惡醉每慚舉敝紬幸多絮不待砧與杵掩戶坐屋角拳局稍得所雖無聖賢對正自潛心處迢迢長安道飄風逆行旅自惜二首淵潛夙知名霄舉頗負志誓探東觀書仰作尚友士黽勉二十年十事九失意中遭家造艱屢為積痾制壯顔忽改色修途更垂翅賈生徒經邦馮衍空抱知寤寐明良詩碎首亦不易坐見流光馳報德恨無地其二青松斧為薪不異蒿與草白璧劘為泥安睹為至寶雖有文章姿積瘵苦縈抱芳春失歡娛白日成懊惱六經箋疏繁一變疇至道意盛歲遄徂榮華倐枯稿伏櫪心尚雄凌霜幹須老造物苟曲全安能遂卑小春日雜言晨暾映林薄庭除鳥微喧雞號猶未倦宛轉登髙垣嚴氣尚欺桞寧到荷與萱時復古壁上土花回緑痕歲月感徂邁幽衷難具論坐使壯夫顔青銅照霜根馮衍已不偶袁絲意徒繁何處商山芝復近東陵園策杖一長往居然謝塵喧南圃古城繡春草翠色交短垣夭桃開何遲李花正翩翻平畦森緑甲圃人初列藩汲井水易渾挽綆意已繁隔塹聞鳴蛙蚯蚓寂不言坐感清明風幽襟愜素園過羅園取適憩林薄道心幽且間園𬞞日已長零雨時尚慳繘井試溉之菲菲緑增顔雖無千章木桃柳自成環日出風凄人日入鳥下山抗意世塗表悠然忘險難雨後久望始得雨耕種猶及時城苔乍回緑港柳俱垂絲跳踏集坎窞取樂無高卑豈徒物性欣童耄各信眉樵歌不擇譜成文聲自詩一唱世升平再賡孝與慈穆風戞新戈歸雲變妍姿仰見北山出美人有幽期初夏偶書春服仍衛病坐與童冠違暖緑雖決決風詠未同歸轉盼百花盡輕綿逐人飛新鴉已出巢習習有光輝人生非彭喬昔鬢今已非若欲築髙臺髙臺竟何為六貴豈無紱五侯亦分圭往者繁盛名所遇多湮微東南爽氣發柔桑緑成圍欲適千古意未可厭深杯夜作斗水入鬵釜薪然初沸驚寸蟲滯幽隂逢春各飛鳴人生值命薄所遇多不平狂草未盡態豪吟豈勝情醉拍青瑶闌仰見白氣橫六合堪一俯千年藉孤撑棲雲固無心化日寧掩明意劇獸欲躍機忘鷗頓盟南尋羡門子共憩黃金城早行雞號出村巷涼颷欺宿酲雲開忽見斗東方漸熹明落葉墮馬前舞意亦輕盈殘月隱樹杪眉黛不勝情病客自多愁况乃聞秋聲一步一嘆息恨繁足屏營人生安即樂豈必公與卿要當識尼父從好勝浮榮秋意雲踈月吐華葉老林張繡凄清意獨苦蕭爽氣初透白鶴飛又還青鸞報何後卧聽銀浦濤人與秋山瘦靜逸二首至樂本無聲簡言始遺味至治本無為用察乃興偽飲水終自樂抱獨仰何愧強置方丈筵欲暢顧多纍歡謔志已馳將送禮復贅安得同心人忘言日相對其二太虛雖泬寥二氣自闔闢山嶽雖不移萬物自生息誰言吾靜拘吾靜乃得逸居靜淵水明行靜岩月出應斷亦不蹉百感難混寂豈必歌繼呼方能謝欣戚讀沈東山老先生所寄先君挽章不見東山翁荏苒二十霜几杖日已遠寤寐恆未忘尚憶垂髫年兩親俱在堂進有師友樂退得父母將歲徂事倐變拱木森墓傍遠勤平生言芝蘭有餘芳猶道管鮑交亦勉男兒強盛篇戞金石沒世垂鴻光道修恨莫報徒憶鬚眉蒼有答夷吾繇檻車郅惲脫狴犴時來齊業興策售亦匡漢丈夫生世間立志貴侃侃多少英與賢未遇恆患難况復抱貞士富貴非所憚豈為雲林深白首輟篇翰漁父歌濁清牛人詠夜旦雖萎蘭亦香不雨雲自燦終然千古下忽有知己歎黽勉讀且耕歲事行復換殘歲山城迫歲暮闌街兒女喧老氓來負布傴僂行且言雜果陳道側列圈多雞豚榖賤不敵鈔祀事安可喧明時宜豐樂徴索無乃繁豈獨吏治敝奢風變丘園婚嫁盛紈綺肆筵亦勞煩况復夜晝飲不計罍與尊生事歲幾入費出乃紛綸豈不有稱貸旦暮聞扣門移居太僕街從仕二十載卜居亦六七身世任蓬轉無問喧與僻最後移闕西地位更平直趨鼓向啓明繞盡宫樹碧城遙漏聲杳起望恆佇立慿仗窗間禽晨晦有消息迂慢恐非宜取近愧寡力暫借鷦鷯枝豈敢望安逸擬古别離曲君向吳中去妾上髙樓望忽聞南鴈聲夜久獨惆悵水西雙鴛鴦水東一鶖鶬未會芙蕖意藕絲空爾長同年會分得是字暮春清且煦賔御此燕喜豈無絲竹繁德音快盈耳憶昔同升日黑髮俱相似荏苒二十年頗覺踈舊齒及時當亨衢一一被金紫入為家庭光出致邦國理長松晚益茂大道行可止往古多才賢閲世固如是離合豈足歎造化有終始珍重斷金心垂芳共青史夜坐次舊韻草色映明月微風生遠松去年南浦雨今夜北窗鍾紈素未應棄煙雲何太工山林有隙地投散亦投慵清夜有涼露庭除多緑莖正憐嬌烏語忽聽焦蟬聲浮雲自西來新月吐微明安得挾黃鵠與子共遐征奉答兄次韻秋日忽已悽小軒納殘照西峯入吾眼振迅思一嘯藹藹棠葉紅千載獨懷召豈無雲臺勳不寫子房貌五斗淵明歸千金魯連笑何况末路塵錐刀計多少鼯技安足稱螢火聊自耀所以希聖徒出處非偶剽餓寧饜薇藿一豫甘衆誚坐玩華月升逸興飛遠嶠丁卯元夜立春後七日始雪燈火已春夕風日亦暄妍望雪意久倦桂屑忽翩翩豈獨農父喜銜杯話豐年踈梅老屋旁乃見清遊仙驚鳥踴而啄臯禽互盤旋白馬嘶長風搖搖載金鞭况聞天日開斥邪用才賢枯朽得吹噓窮谷免顛連暫留上岡田願出新丁錢敢恨衣縷單十口幸復全小臣性惻怛聽言欣且憐更祝雨及時呻吟變歌弦酌酒盡餘興醉下江東船南望湖牽舟乘流上日行不百里春氷已到海魚龍未出水地涸泉脈細天黃塵霾起清波間長洲盤桓進復止豈徒旅色愠三農未有喜青青壟畝麥沙礫壓欲死蒼天亦何意不復閔赤子科徭豈宜緩公事聚如蟻無雪蝗已兆鮮雨旱恐繼縱多良有司焉能救瘡癠臣願告九閽旁求到胥靡甘霖遍海內新緑生地底吾當沽濁酒兼欲致雙鯉浩歌下長川痛飲濟州市夜泊七級偶書泊舟七級口夜久灘潏潏輕風搖水光燈下老魚出繁星麗霄漢經緯誰與識稍喜春泉通新緑添數尺金陵在吾眼公期未可必坐感節序換安得不華髮人生謂如寄有志貴取適此理未易言千慮望一得憶古二首好花生階間風日晴更好有時風雨來不異階前草其二情欣見花好情乖見花惡須看老婦手亦有調羮錯九日遊靈谷地逈意森爽秋水瀠復流萬柏夾修徑古松枝相樛寺門窈且深臺殿若雲浮布席列笙歌同心日遨遊有時狎麋鹿忽爾侶羣鷗心曠境殊豁山深吾可留不識簮纓貴豈復茅茨羞山谷宜有靈賓友此倡酬坐閲寒桂影出門無所求再遊靈谷同陳大理崇之月下散步乘月下鍾嶽山深氣增爽高松偃萬蓋幽澗逸清響扣關碧雲隈適與棘寺往縱嘯起巖鹿狂吟搜象罔金磬杳靄間瑶臺鬱森上客去主未發天遊意徒攘名都富佳麗一代列宏敞依龍地盡濕向日木先長風鳴萬年幹瑞出九華杖漫與林僧談餘興入蒼莽松聲閲世苦多纍息此嘉木陰坐玩磊砢節孤高契芳心遠風自東來乍如鳴素琴漸竽密籟沸劃變戈矛森棲鳥各去枝間雲亦辭林淑氣不爾嚴蕭瑟有此音感之髮竦竪起聼更斂襟調律豈無意事大力不任覆餗明在塗敢試鼎與鬵歎息偃庭際出門春已深雨後思欲一遊牛首漫爾賦之春初見牛首浩欲覽其顛日短多凄風塵鞅苦紏纒今辰雨初霽遙山斂蒼煙思得賞心侶一潄山中泉清願動有違老驥空翩翩惜名不顧身倐忽過流年伊周固洪烈莊列豈不賢人生貴適意華簮非所憐瀛洲即事長廊古松柏深院畫風雨水暖荷漸出人靜鶴獨語碑垂玉亭記前哲留踵武壁載伐桑説近事亦快睹紫崖本公輔愛與聖賢伍題詩遍池臺置筆及牖戶寧菴雖峭拔言動蹈遺矩獨開論文榭不出彈棊塢時來各飛騰此地自今古庭竹猶餘青鄰峯翠可數去歲吾始入治塘亦疏圃豈望菱芡成不辭菜根苦春風不改和夜月明如午一觴時嘯傲萬事付毛羽午坐輕風度松籟庭間午更寂倦鳥貪熟眠幽草何歷歷新鶯忽一囀宛若江上笛翩翩葉間蛾盡日何所覔時物自生長吾性亦順適臨池玩清寒倚竹聆浙瀝誰言牡丹叢不道蘆與荻真意苟自全圭璧同瓦礫悲哉處士心色動於尺檄曾念公子臣牽若執羈靮奇功隨物化榮名今安覿所以大聖徒無為以為績軒冕豈不華一喜生衆惕卓爾巢由存千載欲目擊重陽前一日雨中遣興九月每多雨吾齋况無菊蕭蕭松檜傍草色媚幽獨豈乏同心人舒嘯振巖谷正悲落帽侶流浪至敗俗人生太矜耀動欲垂簡牘苟無道德將所志固僕僕太朴散已久言出成訕讟希聲疇可聞美人倚修竹春日松籟交遠風江濤落林杪虛庭客來稀時復囀野鳥春草漸萌茁碧甃瑩如掃豈必河漢水浩蕩勝潢潦百年貴適意一喜九懊惱擺脫天宇寬境域無巨小寒林亦有筍寒澗亦有藻清虛苟自慰夢寐出塵表送李少宰赴召春雨集郊陌含生被華滋桃李俱無言好風時拂之大人操化機不假爐與錘張弛有妙理量劑諧羣思公昔乘青驄已負梁棟姿明揚三十年海內獲所施清裁簡帝心大雅為世師宿志幾見酬白首寧謂遲飛花初撲缸晴江緑生漪遠節趨金陵新恩舞彤墀我有桞一枝贈之比清詩廟堂惜寸朽萬物正熙熙蓮北坐上分韻得獨字冬日暄且妍鳴鳥集嘉木客從瀛洲來對我清湘竹銜觴潄今古一獻再三祝各言崇令德不道位與祿肝膽何相照鬚眉不空緑相送出前除裴回月中獨孤筠情所託為陳竹坡賦羣芳足春意愛此寒歲叢植之蘭畹傍下有流泉通主人抱奇志徙倚興未窮琅然叩高節千古來淇風清幽既絶俗彩鳯鳴其中偉然君子堂阿閣相玲瓏新雷起蘀龍春水搖蘢蔥素心諒有合散髮池水東熊峰集卷七
