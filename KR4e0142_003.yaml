body:
  text: 熊峯集巻三明石珤撰詩五言律晴郊觀麥縱目晴郊外青青麥自芳葉藏前夜雨花帶及時香淺浪初凝綠輕雲欲試黄東風來往拂應為兩岐忙睡起白晝清如水當軒納好風形忘開口外樂在曲肱中竹榻偏憐舊繩樞不避窮偶懷徐孺子還愧食非躬晴坐十日不作詩新晴偶撚髭冷雲含古意秋葉記相思疎懶成何事蕭條對此時誰家砧杵急空亂郢人辭秋雨何事秋來雨蕭蕭便不同已愁聞落葉争忍傍梧桐客路思千里長門望九重㡬人當此夜揮淚亦隨風憶在京師與從善郎中雨中倡和頗多今君南徙悵然有懷對雨思前事揮毫憶俊才詩情同賈至仙客本天台别後壇應冷春深鴈不來金陵城外路一日㡬花開春渡滹沱世路無閒日風波歳歳新東風沙上鴈落日岸頭人去國曽千里還家又一春林花應笑客憂病往來頻雪鴈懶客無多興庭寒晝掩扉㡬人江上釣一雁雪中歸獨往心何壯遺音世自稀春來諸伴侣有願莫相違題董太守連枝巷手澤經年在深悲人未知陟岡空有望同被己無時老墮風前淚靈鍾雨後芝他年羣從輩長合誦遺詩静夜十日不對鏡新霜又㡬莖疎燈長伴客過鴈一留聲鐘磬城中滿星河檻外明遥聞花月院停杵話西征和許黄門九日述懷往日看花興中年苦太遲静開平世眼閒對廩秋時風雨催枯榦江山得㡬詩因懷工部句瀕老釋歡悲宿性公院清齋夜無寐星月耿前除野客尋詩罷高僧入定初欲來還去夢纔讀又忘書豈為悲華髪聰明漸不如出西郊乆積丘園思春深始出城水添幽澗滿花發舊枝明野哭聞修祭田炊見餉耕年光隨眼過㡬度得閒行故關道中曉望榆關道肩輿坐未安石墻多五色山徑忽千盤松栢何年樹風塵舊日冠半巖有蘭若試上白雲看夜起鼓柝清溪夜張帆待曉風月中雞唱早天下犬聲同暫住能留跡重來欲作翁年華等流水回首語篙工偶書二首紫閣金閨吏穠桃郁李年鳴鐘朝進食撤幄晝分筵禍淺方深念時危未穩眠裂冠如可忍寒暖付青天其二籠鳥曾矜寵䦨花大逞姿不因風雨夕那識艶陽時萬巻將焉用扁舟尚可為從今持史論應悔過崇卑過清流橋北望江國春多雨偶晴圖畫開竹邊朱戸啟花下美人來高栁藏歌榭新鶯過吹臺近郊山更好蒼紫競崔嵬晩坐春色晩何在綠楊來數鴉影單猶作客夢好轉思家風雨牀頭劍笙歌上苑花百年空健興惆悵日西斜午坐松韻灑寒髪清風銷積懷似難芟惡草無可障狂霾湖海書頻滯山林願未諧知音不相待明月滿秦淮秋日寄孟賢秋聲驚短鬢忽忽過中元荷冷紅初褪林幽綠尚繁歸心梁上燕客夢檻中猿不得張公子同來倒玉尊宫詞水殿荷風軟雲車草露新簾垂三峽雨香散六宫春青雀黄龍舳朱衣畫袴人君王渾未厭歌吹已經旬冬夜夜坐無他事危居擁布袍斷編繙竹簡殘火爇松膏寒暑雙車轂生涯一羽毛涓埃渾未報素食愧吾曹南莊書事罷讀離騷賦悠然解獨酲苔痕石上綠山色雨餘青鵠立懷東觀鵬搏快北溟殘鶯猶有意閒向栁邊聽送趙鴻臚省兄春草舊多情西風别恨生高吟動池水清夢落江城宻線秋辭母崇岡曉望兄鵬飛聊一息回首又雲程送人彩鷁乘風順名山過㡬州地形多北共天漢自西流冠履三千客瓊瑶十二樓憶歸江海上應述太平謳移居長安門西安福巷誰言廣陌好陋巷亦清幽夜月春長滿晴雲晝不收宫中聞報漏門外度鳴騶時復乘間興憑軒望五樓道院山中逢道士尊酒坐逍遥草色連天綠雲香入幔飄古潭龍夜語紫府鶴晨朝應有飛仙侶倚樓吹玉簫送别我送霜臺使還歌白雪篇微名曾附驥竒骨自飛鳶夢切雲霄上情忘水石邊臨風舒一嘯驚斷夕陽蟬喜晴㡬日多風雨新晴乍可憐青山當屋角白鳥到花前掃榻袪塵夢揮毫著短篇不須登漢閣有思欲凌烟早朝二首南風霏早露筦簟覺微涵宫漏猶傳五鄰雞已報三冠從燈下正筆憶殿頭簪跨馬看城闕彤雲曉正酣其二散步瑶臺側東方尚渺茫御溝驚珮落宫霧著衣涼上將金裝甲臺臣皂作囊景陽鍾未盡天語徹簷廊燈花誰道春光薄寒燈亦放花粟金装寶樹文火伏丹砂千里長為客三年不見家明朝有鄉信遥寄自天涯開户見殘月開户見殘月雕弓已下絃蛾眉窺淺水玉玦在青天近寺聞清磬趨朝握短鞭不因鐘鼓急春曉正高眠代夏先生題風木巻西風吹拱木哽咽不成音樹古疑翻海人亡莫問琴淚明原畔草魂黑雨中林日暮啼鴉急應憐孝子心恭承誥封母趙為恭人進四品秩從家君貴也喜而有作二首乳烏思反哺荏苒一春無聖主推人子重封視大夫黄金新束帶翠羽舊明珠未得承顔色徘徊立送途其二吾翁推憲法二十五年來直矢何曾曲高槐每自栽兒曹思養色家國愧非才徒藉君王寵殷勤效老萊冬至前二日赴朝天宫習儀罷朝還走馬紫府亦丹墀地擁神仙跡人諳博士儀角聲鳴夜月旗影掛朝曦莫辨黄鐘律寒灰已自知西山莫道山行樂山行愁更深擾龍僧坐鉢飛燕女横金酒著莓苔醉情熏草樹陰夕陽人語静無處覔巢禽長門怨閉妾深宫裏宫門知㡬重君恩如白日妾命自寒蛩月落銀河澹天高玉露濃一般秋枕上聽得景陽鐘秋夜徙倚西風外秋聲滿鳯池何堪砧杵夜又在月明時病葉辭柯響寒桐轉漏遲起看三尺劍悲壯兩難持午夢枕上行千里危樓望欲登有時生兩翼飛到最高層栩栩隨園蝶悠悠訪寺僧白雲看未了鶯語落青綾秋思白露籬間響殘螢是處流朝朝上樓望日日使人愁未遇梅花使空題蕉葉秋殷勤報明月為我照西州過山寺百里見高峯山僧出寺逢老松棲倦鶴幽靄度疎鐘野濶饒風露巖深無夏冬不知天已暮歸騎尚從容送葉守紫衣高葢客誰復歎升沉萬里圖南翼平生拱北心麥岐看入頌牛角遇知音他日簷廊上憑君作傅霖西湖城中稀暇日取適過林泉古寺排金榜離宫枕玉泉折花聊映醉藉草亦成眠不學王孫嘔平心過百年雙鴈傷翮育于庭中有感自是排雲侶秋聲被網羅耦行猶作字長恨不成歌北望燕山月南思楚水波忽驚樓外影愁絶定如何遊北寺亨上人後園偶為尋詩出穠華觸眼新鳥歌行酒地花覆倚䦨人風籟渾無譜蟲書太逼真絶勝絃管夜紅袖舞香塵城北悵望城東北逺風増客愁生涯自流水人世本虚舟淚向清時墮身當未老投誰能齊萬物長嘯憶莊周哭貴閑女何處能忘爾紗牕睡起遲古詩吟絶句小學誦題辭竹馬朝隨伴􅏁笙手自吹有時端坐乆狼籍畫雙眉過丘頭寺故韓師院古寺高僧去荒林但鳥歸鐘浮石潭月苔滿畫廊衣世事驚春夢西風冷宦機坐看秋葉下惆悵昔人非西港高城舒一望明月下銀沙草閣平臨野溪流半繞槎樹嚴秋尚茂蘭静晩宜花不為尋真隱誰能卧紫霞風中花春花有殊色何事逐風流欲墮還依水頻飛不過樓託枝憐命薄傾國使人愁願落簾櫳裏遺香尚及秋園中思君不可見三月正花飛楊栁垂金縷新苔勝舞衣鳥來枝上語人自水邊歸盡日西南望空山但落暉題都下主人壁乆出易春衣田園苦未歸興同花漫發身與燕俱飛古劍雙明雪殘編㡬絶韋金張雖可屬意不在光輝東昌荅鄭侍御勞君相問訊别意正茫茫魯國風何古吳山路更長水平舟去穩春暖鴈飛忙安得乘驄使追隨達建康同陳宗之諸同年飲雞鳴山憑虚閤時羅太常景鳴作倡二首細雨緣山到清風待客來閣凌霄漢起門傍斗牛開雲樹千家錦豪華六代才遺蹤不可問今古一銜杯其二二月到金陵秋山始一行人間無此地坐上得清卿痛飲平生侶高樓萬古情蓬萊在何處縹緲暮聞笙詠御溝紅葉宫樹悴清霜泉聲落建章更無紅葉字猶是碧波光氣肅秋將老人寒影太長東流和宿恨黯慘度年芳得白宗伯先生書北鴈正南翔書來自帝鄉人同秋色老情比道塗長禮樂歸宗伯文章憶大方江湖無限意延佇㡬斜陽秋夜曲檻散沉思高齋瞻夜雲人聞河漢語天示斗星文有恨能銷骨無詩可贈君溪風與巖露悲哽若為分雨後奉憶家兄小雪還逢雨晴牕漸覺寒南來風土異北寄鴈魚難晩稻垂霜穗殘荷捧露盤塞門今夜月禁冷立危欄秋興今年秋令早白露已霏霏巢乆燕將别草寒螢漸稀多情惜亭栁未老定漁磯更與江湖伴收荷為製衣熊峯集巻三
