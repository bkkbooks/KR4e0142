body:
  text: 熊峯集目録别集類五明巻一五言古巻二七言古巻三五言律巻四七言律五言排律五言絶句七言絶句巻五賦表疏碑文記傳文説巻六序銘墓誌銘墓表巻七四言古五言古巻八七言古巻九五言律七言律五言排律五言絶句七言絶句六言絶句巻十賦記傳説序賛銘墓誌銘墓表臣等謹案熊峯集十巻明石珤撰珤字邦彦藁城人成化丁未進士官至文淵閣大學士諡文隠改諡文介事跡具明史本傳珤出李東陽之門東陽毎稱後進可託以柄斯文者惟珤一人皇甫汸嘗刪定其集為四巻嵗久板佚國朝康熙丁未餘姚孫光􅀢為藁城知縣得别集遺稿於其家為合而重刋之嗣聞真定梁清標家有其全稿乃購得續刋共為十巻此本自一巻至四巻為詩五巻六巻為文七巻至九巻又為詩十巻又為文盖刋板已定不能依類續入故體例叢脞如是也珤詩文皆平正通達具有茶陵之體故東陽特許之當北地信陽駸駸代興之日而珤獨堅守師説屢典文衡皆力斥浮誇使粹然一出於正雖才學皆遜東陽而湜湜持正不趨時好亦可謂堅立之士矣乾隆四十六年正月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
